4"],["Cl\xEDnica Especializada II","2","35 / 9 / 4","UT 5, TE 4"],["Polo de Biotecnologia III","3","60 / 14 / 8","RE 6, UT 4, TE 4"],["Inst. de Cibern\xE9tica III","3","60 / 14 / 8","RE 6, UT 4, TE 4"]]}},{h:"Tecnologia (TE) - pre\xE7o base $6, expande horizontalmente"},{table:{head:["Projeto TE","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["Startup de App I","1","15 / 6 / 2","UT 6"],["Data Center I","1","15 / 6 / 2","UT 6"],["Sala de Servidores I","1","15 / 6 / 2","MA 6"],["Suporte de TI I","1","15 / 6 / 2","MA 6"],["Provedor de Nuvem I","1","15 / 6 / 2","HO 6"],["Campus de Software II","2","25 / 10 / 4","UT 6, MA 4"],["Hub de Rede II","2","25 / 10 / 4","UT 6, HO 4"],["Operadora de Telecom II","2","25 / 10 / 4","MA 6, HO 4"],["Cluster de IA Senciente III","3","40 / 16 / 8","UT 6, MA 5, HO 5"],["Computa\xE7\xE3o Qu\xE2ntica III","3","40 / 16 / 8","UT 6, MA 5, HO 5"]]}}]}];var vl=he(Ja());var nv={" (SOLVENCY - half price)":" (INSOLV\xCANCIA - metade do pre\xE7o)"," (SOLVENCY)":" (INSOLV\xCANCIA)"," A plot beside the building takes a new wing, which can sell into that plot's district; a plot under it takes a new storey, and rent for every storey goes to that plot's owner.":" Um lote ao lado do pr\xE9dio recebe uma ala nova, que pode vender no distrito daquele lote; um lote embaixo dele recebe um andar novo, e o aluguel de cada andar vai para o dono daquele lote."," Plots must share an edge \u2014 corners do not count.":" Os lotes precisam compartilhar uma borda \u2014 cantos n\xE3o contam.","({0} loan)":"({0} empr.)","+{0}MC":"+{0}MC","18 supply lines in all: no dead ends, and no safe corner":"18 linhas de fornecimento no total: nenhum beco sem sa\xEDda, nenhum canto seguro","1st":"1\xBA","2 EP per company level, banked the moment you build or upgrade it":"2 EP por n\xEDvel de empresa, embolsados no instante em que voc\xEA a constr\xF3i ou expande","2nd":"2\xBA","3 EP the first time you build in each industry \u2014 paid immediately":"3 EP na primeira vez que voc\xEA constr\xF3i em cada setor \u2014 pagos na hora","3 years of 4 quarters \u2014 12 rounds in total":"3 anos de 4 trimestres \u2014 12 rodadas no total","3rd":"3\xBA","4th":"4\xBA","5 EP for most plots and 5 for most districts at every year end \u2014 10 each from 4 players up; a tie pays 2 (4) each":"5 EP por mais lotes e 5 por mais distritos a cada fim de ano \u2014 10 cada um a partir de 4 jogadores; empate paga 2 (4) cada","5th":"5\xBA","6th":"6\xBA","=== GAME OVER \u2014 final scoring complete ===":"=== FIM DE JOGO \u2014 pontua\xE7\xE3o final conclu\xEDda ===","A Logistic Hub straddles a border and joins the two districts either side, instead of standing on a plot and reaching only its own.":"Um Centro Log\xEDstico fica sobre uma divisa e une os dois distritos de cada lado, em vez de ficar num lote e alcan\xE7ar apenas o seu pr\xF3prio.","A Megacorp is worth 8\u201322 EP, but eats companies and locks a slot":"Uma Megacorpora\xE7\xE3o vale 8\u201322 EP, mas consome empresas e trava um espa\xE7o","A company level is worth 3 EP instead of 2, which puts far more of the game's weight on how tall you build and pushes land, cash and the entry bonuses into the background.":"Um n\xEDvel de empresa vale 3 EP em vez de 2, o que joga muito mais peso do jogo sobre a altura do que voc\xEA constr\xF3i e empurra terreno, dinheiro e os b\xF4nus de entrada para o segundo plano.","A company reaches its own district, plus whatever its ability grants":"Uma empresa alcan\xE7a o pr\xF3prio distrito, mais o que a habilidade dela conceder","A company waits for the next year end to take its EP, instead of scoring the moment it is built or upgraded.":"Uma empresa espera o pr\xF3ximo fim de ano para receber seus EP, em vez de pontuar no momento em que \xE9 constru\xEDda ou expandida.","A company's level decides how much room it needs, and half the industries need it sideways. This is the rule that decides how much land you have to buy.":"O n\xEDvel de uma empresa define de quanto espa\xE7o ela precisa, e metade dos setores precisa dele na horizontal. \xC9 esta a regra que define quanto terreno voc\xEA precisa comprar.","A crowded industry can fall to $2, still twice what recycling pays":"Um setor lotado pode cair a $2, ainda o dobro do que a reciclagem paga","A neglected one can climb to $12 per unit":"Um negligenciado pode subir a $12 por unidade","A new Logistic Hub opens near {0}{1}":"Um novo Centro Log\xEDstico abre perto de {0}{1}","A quarter, step by step":"Um trimestre, passo a passo","A rule that misfired, or a bug.":"Uma regra que falhou, ou um bug.","A table seats six. All four Megacorp tiers are in from four players. The fifth and sixth seats open a fifth and sixth slot on each of the three working tracks, and draw three, then four, tiles from each tier instead of two.":"Uma mesa comporta seis. Todos os quatro patamares de Megacorpora\xE7\xE3o entram a partir de quatro jogadores. O quinto e o sexto assentos abrem um quinto e um sexto espa\xE7o em cada uma das tr\xEAs trilhas de trabalho, e sacam tr\xEAs, depois quatro, fichas de cada patamar em vez de duas.","ACTION \u2014 tracks resolve and you act":"A\xC7\xC3O \u2014 as trilhas resolvem e voc\xEA age","AFTER BILLS":"AP\xD3S AS CONTAS",Academic:"Acad\xEAmico",Action:"A\xE7\xE3o","Active companies":"Empresas ativas","Add something to tell yourselves apart \u2014 or carry on, if it really is you.":"Acrescente algo para diferenciar voc\xEAs dois \u2014 ou siga assim, se for voc\xEA mesmo.","Amber-bordered cells are cross-sell slots \u2014 Manufacturing may fill another industry's demand within its own footprint.":"C\xE9lulas com borda \xE2mbar s\xE3o espa\xE7os de venda cruzada \u2014 Manufatura pode atender a demanda de outro setor dentro da pr\xF3pria \xE1rea ocupada.","An idea":"Uma ideia","Antimatter Reactor III":"Reator de Antimat\xE9ria III","Anything you cannot sell recycles for just $1 a unit":"Tudo o que voc\xEA n\xE3o vender \xE9 reciclado por apenas $1 a unidade","Apex Group":"Grupo Apex","App Startup I":"Startup de App I","Assembly Workshop I":"Oficina de Montagem I","At the start of Production you may switch your concession on: your Utilities production then sells for $1 above the current price this quarter. Every quarter you sell at that premium, the Utilities price falls one step at the end of the quarter.":"No in\xEDcio da Produ\xE7\xE3o voc\xEA pode ligar sua concess\xE3o: sua produ\xE7\xE3o de Servi\xE7os P\xFAblicos ent\xE3o vende por $1 acima do pre\xE7o atual neste trimestre. A cada trimestre em que voc\xEA vender com esse \xE1gio, o pre\xE7o de Servi\xE7os P\xFAblicos cai um passo no fim do trimestre.","At the start of Production, you may raise one industry you do NOT operate by one step; your Retail then reaches one extra district this quarter. You may also decline.":"No in\xEDcio da Produ\xE7\xE3o, voc\xEA pode subir em um passo um setor que voc\xEA N\xC3O opera; seu Varejo ent\xE3o alcan\xE7a um distrito a mais neste trimestre. Voc\xEA tamb\xE9m pode recusar.","Auto Plant II":"Montadora II","Average EP per player per game, across every recorded match.":"M\xE9dia de EP por jogador por partida, em todas as partidas registradas.","Average winning score":"Pontua\xE7\xE3o vencedora m\xE9dia","Back to results":"Voltar aos resultados","Back to sign in":"Voltar ao login","Back to the lobby. Your seat is kept - the game is under Your games when you want it.":"Voltar ao lobby. Seu assento fica guardado - a partida est\xE1 em Suas partidas quando voc\xEA quiser.","Bed & Breakfast I":"Cama e Caf\xE9 I","Biomass Plant I":"Usina de Biomassa I","Biotech Campus III":"Polo de Biotecnologia III","Biz owner: {0}":"Dono da empresa: {0}","Board Meeting":"Reuni\xE3o do Conselho","Board Meeting (both meeples)":"Reuni\xE3o do Conselho (os dois trabalhadores)","Board Meeting seats two players, but the second seat is under the IPO tile until the first Megacorp is formed.":"A Reuni\xE3o do Conselho comporta dois jogadores, mas o segundo assento fica sob a ficha de IPO at\xE9 que a primeira Megacorpora\xE7\xE3o seja formada.","Board Meeting takes both your workers. Merge the exact set of company levels a tile asks for and it becomes a Megacorp: big points now, a dividend every quarter, and a bill from the neighbours.":"A Reuni\xE3o do Conselho leva os seus dois trabalhadores. Fa\xE7a a fus\xE3o na combina\xE7\xE3o exata de n\xEDveis de empresa que uma ficha pede e ela vira uma Megacorpora\xE7\xE3o: muitos pontos agora, um dividendo a cada trimestre e uma conta cobrada pelos vizinhos.","Board Mtg":"Conselho","Boutique Hotel II":"Hotel Boutique II","Build a company and you push your own industry's price DOWN \u2014 more supply. Every supplier you now pay gets pushed UP \u2014 more demand. Each of those is a whole dollar.":"Construa uma empresa e voc\xEA empurra o pre\xE7o do seu pr\xF3prio setor para BAIXO \u2014 mais oferta. Todo fornecedor que voc\xEA passa a pagar \xE9 empurrado para CIMA \u2014 mais demanda. Cada um desses vale um d\xF3lar inteiro.","Build, produce, sell, score \u2014 3 fiscal years, solo vs bots.":"Construa, produza, venda, pontue \u2014 3 anos fiscais, solo contra bots.","Business Hotel II":"Hotel Executivo II","Business:":"Empresa:","But they all act before you, and may take what you wanted":"Mas todos agem antes de voc\xEA, e podem levar o que voc\xEA queria","Buy it as it stands":"Retomar como est\xE1","Buying that plot":"Comprar esse lote","By the winner":"Pelo vencedor","CLOSING \u2014 a Logistic Hub is placed; years end with scoring":"ENCERRAMENTO \u2014 um Centro Log\xEDstico \xE9 colocado; os anos terminam com pontua\xE7\xE3o",Cancel:"Cancelar","Canning Facility I":"F\xE1brica de Conservas I","Capsule Hotel I":"Hotel C\xE1psula I","Cash on hand":"Dinheiro em caixa","Chemical Plant II":"Ind\xFAstria Qu\xEDmica II","Choose a new password":"Escolha uma nova senha","Choose a question\u2026":"Escolha uma pergunta\u2026","City Center":"Centro da Cidad

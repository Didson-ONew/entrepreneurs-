# =============================================================================
# Entrepreneurs on Render.
#
# With this file in the repository, Render can build the service from the
# blueprint instead of from a form somebody filled in once and forgot. A merge
# to main then deploys, and the settings that matter live in version control
# where you can see them.
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# READ THIS BEFORE APPLYING IT
#
# The `disk` block below is the whole reason this file exists, and **a disk
# needs a paid instance type**. Render's free tier has no persistent storage
# at all: the filesystem is rebuilt on every deploy AND on every wake from
# sleep, so accounts.json, matches.jsonl and feedback.json are erased over and
# over. That is what emptied the hall of fame and let a registered name be
# registered a second time.
#
# There is no free way around it. Either:
#
#   Keep the disk       an instance type that supports one (Starter and up).
#                       Accounts and the record book survive deploys, restarts
#                       and sleep. This is what the file is set up for.
#
#   Stay on free        delete the `plan:` line and the whole `disk:` block,
#                       and change ENT_DATA_DIR to /opt/render/project/src/data.
#                       Everything then works exactly as it does now, including
#                       losing the accounts and the record book on every deploy.
#                       Take a copy of the data before each deploy if you care
#                       about it.
#
# Applying a blueprint matches services BY NAME. If your existing service is
# not called `entrepreneurs`, either rename it in the Render dashboard first or
# change the name here - otherwise Render creates a SECOND service on a new URL
# and the link you have given people keeps pointing at the old one.
# =============================================================================

services:
  - type: web
    name: entrepreneurs
    runtime: node
    # A disk cannot be attached to a free instance. See the note above.
    plan: starter
    autoDeploy: true

    # esbuild is a devDependency, so the install has to include them. Building
    # here rather than trusting the committed HTML means the pages can never be
    # served from an older copy of the rules than the server is running - the
    # mismatch the lobby warns about is simply not reachable.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js

    # Cheap, no side effects, and 200 only once the server is actually serving.
    healthCheckPath: /api/presence

    # The one thing that must outlive a deploy.
    disk:
      name: entrepreneurs-data
      mountPath: /var/lib/entrepreneurs
      sizeGB: 1

    envVars:
      # Must match the disk's mountPath above, or the data goes back on the
      # ephemeral filesystem and is silently erased again.
      - key: ENT_DATA_DIR
        value: /var/lib/entrepreneurs

      # Render terminates TLS in front of the service, so every request arrives
      # from the same internal address. Without this the rate limiter counts the
      # whole internet as one visitor and slows everybody down together; with it
      # the limiter reads X-Forwarded-For, which only Render can set here.
      - key: TRUST_PROXY
        value: "1"

      # Which accounts may read the playtest notes and see who is at which
      # table. This names them; it does not create them - those accounts still
      # have to be registered through the site.
      - key: ENT_ADMINS
        value: Dids,Didson

      - key: NODE_VERSION
        value: "22"

      # PORT is set by Render and read by server.js. Do not set it here.

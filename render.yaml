# =============================================================================
# Entrepreneurs on Render.
#
# With this file in the repository, Render builds the service from the blueprint
# instead of from a form somebody filled in once and forgot. A merge to main
# then deploys on its own.
#
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply
#
# THE DATA SURVIVES DEPLOYS, AND THAT IS WHAT THE DISK BELOW IS FOR
#
# Everything the server must not lose lives in one directory - accounts, the
# hall of fame, the playtest notes, and any game in progress:
#
#   accounts.json   who is registered, and the session signing secret
#   matches.jsonl   the hall of fame
#   feedback.json   the playtest notes
#   games.json      games currently being played
#
# That directory is a mounted disk at /var/lib/entrepreneurs, OUTSIDE the
# application folder, so replacing the application folder on every deploy no
# longer touches it. ENT_DATA_DIR below points at the mount, and the two must
# always agree - datadir.js prints where it landed at boot and says plainly if
# it is somewhere a deploy would erase.
#
# THIS USED TO BE A FREE INSTANCE, and a free instance has no permanent storage:
# its filesystem is rebuilt from the deploy on every restart, including waking
# from the sleep it drops into after fifteen idle minutes. Everything above was
# erased over and over, and everyone had to register again each time. That is
# what the disk fixed. Going back to `plan: free` brings all of it back, so if
# the plan is ever changed, remove the disk and expect the wipes.
#
# THE BACKUP TAB IS STILL WORTH KNOWING ABOUT. It is no longer what keeps the
# site working - the disk is - but it is still the way to take a copy off this
# host: Download a copy from the Playtest panel, and Put a copy back to merge it
# into a running server. Putting one back never deletes anything (see
# backup.js), so it is safe to press when unsure. Useful for moving to new
# hosting, keeping an off-site copy, or seeding a fresh instance.
#
#   THAT FILE HOLDS PASSWORD HASHES AND EMAIL ADDRESSES. Keep it as carefully as
#   a password list, and never commit it - this repository is public, and
#   .gitignore blocks data/, accounts.json and matches.jsonl for that reason.
#
# APPLYING THIS TO A SERVICE THAT ALREADY EXISTS: a blueprint matches services
# BY NAME. If yours is not called `entrepreneurs`, either rename it in the
# Render dashboard first or change the name here - otherwise Render creates a
# SECOND service on a new URL, and the link you have given people keeps pointing
# at the old one. Changing `plan` also affects billing, so Render will ask for
# confirmation in the dashboard rather than applying it on an autodeploy.
# =============================================================================

services:
  - type: web
    name: entrepreneurs
    runtime: node
    plan: starter
    autoDeploy: true

    # Permanent storage. This is the whole reason accounts survive a deploy; see
    # ENT_DATA_DIR below, which must name this same path.
    disk:
      name: entrepreneurs-data
      mountPath: /var/lib/entrepreneurs
      sizeGB: 1

    # esbuild is a devDependency, so the install has to include them. Building
    # here rather than trusting the committed HTML means the pages can never be
    # served from an older copy of the rules than the server is running - the
    # mismatch the lobby warns about is simply not reachable.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js

    # Cheap, no side effects, and 200 only once the server is actually serving.
    healthCheckPath: /api/presence

    envVars:
      # The mounted disk above. It is deliberately OUTSIDE the application
      # folder, so a deploy replacing that folder leaves the data alone. If this
      # and the disk's mountPath ever disagree, the server writes to a folder
      # inside the app instead and the wipes come back - datadir.js says so at
      # boot, in those words, so read the deploy log after changing either.
      - key: ENT_DATA_DIR
        value: /var/lib/entrepreneurs

      # Render terminates TLS in front of the service, so every request arrives
      # from the same internal address. Without this the rate limiter counts the
      # whole internet as one visitor and slows everybody down together; with it
      # the limiter reads X-Forwarded-For, which only Render can set here.
      - key: TRUST_PROXY
        value: "1"

      # Which accounts may read the playtest notes and see who is at which table.
      # This names them; it does not create them - those accounts still have to
      # be registered through the site once. With the disk in place that
      # registration now survives, so it is a one-time job rather than something
      # to redo after every deploy.
      - key: ENT_ADMINS
        value: Dids,Didson

      - key: NODE_VERSION
        value: "22"

      # PORT is set by Render and read by server.js. Do not set it here.

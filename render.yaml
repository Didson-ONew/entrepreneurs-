# =============================================================================
# Entrepreneurs on Render — free instance.
#
# With this file in the repository, Render builds the service from the blueprint
# instead of from a form somebody filled in once and forgot. A merge to main
# then deploys on its own.
#
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply
#
# THERE IS NO DISK HERE, AND IT IS NOT AN OVERSIGHT
#
# A free instance has no permanent storage. Its filesystem is rebuilt from the
# deploy every time the service restarts - which includes waking from the sleep
# it drops into after fifteen idle minutes. So everything the server remembers
# between games is erased, over and over:
#
#   accounts.json   who is registered, and the session signing secret
#   matches.jsonl   the hall of fame
#   feedback.json   the playtest notes
#   games.json      a game in progress ends
#
# A mounted disk fixes all of that, and it WAS tried. Render refused it:
#
#     Disks are not available for this compute plan
#
# The trap is that "plan" means two different things on Render. A service has a
# COMPUTE PLAN (free, starter, standard...) and the workspace around it has a
# WORKSPACE PLAN (Hobby, Pro, Scale, Enterprise). Paying for a starter INSTANCE
# is not enough - disks need a paid WORKSPACE, which is Pro at $25/mo. This
# workspace is on Hobby, so the blueprint sync failed on all three counts: the
# disk, the plan change, and the ENT_DATA_DIR that pointed at the mount.
#
# So do not add a `disk:` block back without moving the workspace to Pro first,
# or every sync from now on goes red. If the workspace IS moved to Pro, the whole
# fix is:
#
#   plan: starter
#   disk:
#     name: entrepreneurs-data
#     mountPath: /var/lib/entrepreneurs
#     sizeGB: 1
#
#   ...and set ENT_DATA_DIR to /var/lib/entrepreneurs so it matches the mount.
#
# WHAT KEEPS ALL OF IT ANYWAY: ENT_BACKUP_REPO and ENT_BACKUP_TOKEN, below.
# The server writes a backup to a private GitHub repository whenever anything
# worth keeping happens and reads it back at boot, so the wipe still happens and
# simply stops costing anything. Nothing to remember before or after a deploy.
#
# ENT_SEED_BACKUP, also below, predates that and now only covers the accounts.
# It is worth keeping as a floor: it needs no network at boot, so it still works
# on the day GitHub is down. Where the two overlap the store wins, because it is
# never stale.
#
# The Backup tab in the Playtest panel is still there for taking a copy away by
# hand. Putting one back never deletes anything (see backup.js), so it is safe
# to press when unsure. A game in progress is the one thing nothing can bring
# back on this tier.
#
#   THE BACKUP FILE HOLDS PASSWORD HASHES AND EMAIL ADDRESSES. Keep it as
#   carefully as a password list, and never commit it - this repository is
#   PUBLIC, and .gitignore blocks data/, accounts.json and matches.jsonl for
#   exactly that reason. ENT_SEED_BACKUP belongs in the Render dashboard, which
#   stores it out of the repository, and nowhere else.
#
# APPLYING THIS TO A SERVICE THAT ALREADY EXISTS: a blueprint matches services
# BY NAME. If yours is not called `entrepreneurs`, either rename it in the
# Render dashboard first or change the name here - otherwise Render creates a
# SECOND service on a new URL, and the link you have given people keeps pointing
# at the old one.
# =============================================================================

services:
  - type: web
    name: entrepreneurs
    runtime: node
    plan: free
    autoDeploy: true

    # esbuild is a devDependency, so the install has to include them. Building
    # here rather than trusting the committed HTML means the pages can never be
    # served from an older copy of the rules than the server is running - the
    # mismatch the lobby warns about is simply not reachable.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js

    # Cheap, no side effects, and 200 only once the server is actually serving.
    healthCheckPath: /api/presence

    envVars:
      # On a free instance this is inside the application folder, which is the
      # folder every deploy replaces. The server says so at boot, in those words,
      # so the warning in the log is expected here rather than a mistake. See the
      # header: a disk would fix it and needs a Pro workspace.
      - key: ENT_DATA_DIR
        value: /opt/render/project/src/data

      # Render terminates TLS in front of the service, so every request arrives
      # from the same internal address. Without this the rate limiter counts the
      # whole internet as one visitor and slows everybody down together; with it
      # the limiter reads X-Forwarded-For, which only Render can set here.
      - key: TRUST_PROXY
        value: "1"

      # Which accounts may read the playtest notes and see who is at which table.
      # This names them; it does not create them - those accounts still have to
      # be registered through the site, and ENT_SEED_BACKUP is what stops that
      # having to be done again after every wipe.
      - key: ENT_ADMINS
        value: Dids,Didson

      - key: NODE_VERSION
        value: "22"

      # A backup file, accounts only, base64 - merged into the data directory at
      # boot so a wipe does not cost anyone their registration. Produce the value
      # with:
      #
      #     node account_tool.js seed entrepreneurs-backup-YYYY-MM-DD.json
      #
      # and paste it into the Render dashboard. It is deliberately NOT given a
      # value here: it contains password hashes, and this repository is public.
      # `sync: false` is what tells Render to ask for it in the dashboard rather
      # than expecting to find it in this file.
      - key: ENT_SEED_BACKUP
        sync: false

      # --- keeping the data across a deploy ----------------------------------
      # THIS IS WHAT MAKES THE WIPE ABOVE STOP MATTERING. The server writes a
      # backup to a PRIVATE GitHub repository whenever a game finishes, a note
      # is left or an account changes, and reads it back at boot. Set these two
      # and there is nothing to remember before or after a deploy.
      #
      #   1. New PRIVATE repo on GitHub, e.g. Didson-ONew/entrepreneurs-data.
      #      It can be completely empty.
      #   2. Settings -> Developer settings -> Personal access tokens ->
      #      Fine-grained tokens -> Generate. Repository access: only that one
      #      repo. Permissions: Contents -> Read and write. Nothing else.
      #
      # ENT_BACKUP_REPO   owner/name of that private repo
      # ENT_BACKUP_TOKEN  the fine-grained token
      #
      # IT MUST BE PRIVATE. The file holds password hashes and email addresses.
      # A secret gist is NOT private - it is unlisted, and anyone with the link
      # can read it - which is why this uses a repo. Both `sync: false`: the
      # token is a password and THIS repository is public.
      #
      # Restoring is a merge that only ever adds what is missing, so a copy a
      # few minutes stale can never undo a password change made on the live
      # site, and a failure never stops the server - it logs and carries on.
      - key: ENT_BACKUP_REPO
        sync: false
      - key: ENT_BACKUP_TOKEN
        sync: false

      # --- voice relay -------------------------------------------------------
      # THE TWO BELOW ARE THE ONES TO SET. Cloudflare Realtime's TURN service
      # is free for the first 1,000 GB a month, and relayed voice runs about
      # 50 kbps each way per pair of players - an evening of six-player games
      # is measured in hundreds of megabytes, so this never leaves the free
      # tier in practice.
      #
      #   Cloudflare dashboard -> Realtime -> TURN -> Create
      #   Copy the Turn Token ID and the API Token into these two:
      #
      # ENT_TURN_CF_KEY_ID      the TURN key's id
      # ENT_TURN_CF_API_TOKEN   its API token - a password, keep it here only
      #
      # The server holds the key and asks Cloudflare to mint a short-lived
      # credential per call; the key itself never reaches a browser.
      - key: ENT_TURN_CF_KEY_ID
        sync: false
      - key: ENT_TURN_CF_API_TOKEN
        sync: false
      #
      # --- or any other TURN provider, if you would rather not use Cloudflare -
      # Without these the voice call uses free public STUN only. That finds a
      # path between two laptops on home broadband, and it CANNOT find one
      # between two phones on mobile data: carrier NAT gives out a different
      # public port per destination, so the address STUN reports is dead before
      # the other player tries it. A TURN relay is the only thing that gets
      # through, and it is what the "could not connect" in the Voice tab means.
      #
      # ENT_TURN_URLS  is the relay, comma separated:
      #                  turn:relay.example.com:3478,turns:relay.example.com:5349
      # then EITHER
      # ENT_TURN_SECRET  a shared secret, if the relay speaks coturn's REST
      #                  scheme - preferred, because the server then mints a
      #                  credential per player that expires within the hour
      # OR
      # ENT_TURN_USER / ENT_TURN_PASS   a fixed username and password
      #
      # All `sync: false`: a relay credential is a password, and this repository
      # is public. Set them in the Render dashboard. Leaving them unset is fine
      # and is the state the service is in today - the boot log says which.
      # HOSTING_GUIDE.md has the whole explanation and where to get a relay.
      - key: ENT_TURN_URLS
        sync: false
      - key: ENT_TURN_SECRET
        sync: false
      - key: ENT_TURN_USER
        sync: false
      - key: ENT_TURN_PASS
        sync: false

      # PORT is set by Render and read by server.js. Do not set it here.

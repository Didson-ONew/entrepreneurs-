# =============================================================================
# Entrepreneurs on Render — free instance.
#
# With this file in the repository, Render builds the service from the blueprint
# instead of from a form somebody filled in once and forgot. A merge to main
# then deploys on its own.
#
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply
#
# WHAT "FREE" MEANS HERE
#
# A free instance has no permanent storage. Its filesystem is rebuilt from the
# deploy every time the service restarts - which includes waking from the sleep
# it drops into after fifteen idle minutes. So everything the server remembers
# between games is erased, over and over:
#
#   accounts.json   everyone has to register again
#   matches.jsonl   the hall of fame starts from nothing
#   feedback.json   the playtest notes are gone
#   games.json      a game in progress ends
#
# That is not a fault to be fixed in configuration; it is what the tier is. The
# answer is the Backup tab in the Playtest panel: Download a copy, and Put a
# copy back afterwards. It restores the accounts, the hall of fame and the notes
# in one go. A game in progress is the one thing it cannot bring back.
#
# TO STOP THE WIPES ENTIRELY, an instance type that supports a disk is the only
# way. Then add, and nothing else changes:
#
#   plan: starter
#   disk:
#     name: entrepreneurs-data
#     mountPath: /var/lib/entrepreneurs
#     sizeGB: 1
#
#   ...and set ENT_DATA_DIR to /var/lib/entrepreneurs so it matches the mount.
#
# APPLYING THIS TO A SERVICE THAT ALREADY EXISTS: a blueprint matches services
# BY NAME. If yours is not called `entrepreneurs`, either rename it in the
# Render dashboard first or change the name here - otherwise Render creates a
# SECOND service on a new URL, and the link you have given people keeps pointing
# at the old one.
# =============================================================================

services:
  - type: web
    name: entrepreneurs
    runtime: node
    plan: free
    autoDeploy: true

    # esbuild is a devDependency, so the install has to include them. Building
    # here rather than trusting the committed HTML means the pages can never be
    # served from an older copy of the rules than the server is running - the
    # mismatch the lobby warns about is simply not reachable.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js

    # Cheap, no side effects, and 200 only once the server is actually serving.
    healthCheckPath: /api/presence

    envVars:
      # On a free instance this is inside the application folder, which is the
      # folder every deploy replaces. The server says so at boot, in those words,
      # so the warning in the log is expected here rather than a mistake.
      - key: ENT_DATA_DIR
        value: /opt/render/project/src/data

      # Render terminates TLS in front of the service, so every request arrives
      # from the same internal address. Without this the rate limiter counts the
      # whole internet as one visitor and slows everybody down together; with it
      # the limiter reads X-Forwarded-For, which only Render can set here.
      - key: TRUST_PROXY
        value: "1"

      # Which accounts may read the playtest notes and see who is at which table.
      # This names them; it does not create them - those accounts still have to
      # be registered through the site, and on a free instance that has to be
      # done again after every wipe (or restored from a backup file).
      - key: ENT_ADMINS
        value: Dids,Didson

      - key: NODE_VERSION
        value: "22"

      # PORT is set by Render and read by server.js. Do not set it here.

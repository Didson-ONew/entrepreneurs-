. Toda partida de teste que pareceu sem gra\xE7a era uma mesa que ainda n\xE3o tinha percebido isso."}]},{id:"setup",title:"Prepara\xE7\xE3o",blocks:[{p:"O tabuleiro \xE9 montado do zero a cada partida: os quatro distritos centrais s\xE3o um Centro Financeiro, uma \xC1rea Industrial, um Centro C\xEDvico e um Marco, embaralhados entre as quatro c\xE9lulas do meio, e doze dos dezesseis distritos de sub\xFArbio s\xE3o sorteados ao acaso para o anel ao redor deles. N\xE3o h\xE1 duas partidas com o mesmo mapa."},{h:"Assentos, capital e m\xE3o inicial"},{p:"Os assentos s\xE3o sorteados - voc\xEA n\xE3o \xE9 automaticamente o primeiro. Seu dinheiro inicial e seu n\xFAmero de Projetos seguem o assento que voc\xEA tirou, n\xE3o o jogador que voc\xEA \xE9: assentos posteriores recebem menos dinheiro, mas mais cartas. A tabela se l\xEA como dinheiro / Projetos."},{table:{head:["Jogadores","Assento 1","Assento 2","Assento 3","Assento 4","Assento 5","Assento 6"],rows:[["6","$25 / 1","$22 / 2","$22 / 2","$19 / 3","$19 / 3","$16 / 4"],["5","$25 / 1","$22 / 2","$22 / 2","$19 / 3","$16 / 4","-"],["4","$25 / 1","$22 / 2","$22 / 2","$19 / 3","-","-"],["3","$25 / 1","$22 / 2","$19 / 3","-","-","-"],["2","$20 / 2","$20 / 2","-","-","-","-"]]}},{h:"O draft"},{p:"Cada baralho de setor \xE9 embaralhado inteiro, ent\xE3o qualquer n\xEDvel pode estar no topo - um n\xEDvel 3 pode estar l\xE1 j\xE1 na primeira escolha. A carta do topo de cada baralho fica p\xFAblica a partida inteira."},{p:"Os Projetos iniciais s\xE3o draftados na ordem inversa dos assentos - o \xDALTIMO assento escolhe primeiro. Na sua escolha, voc\xEA pega a carta do topo, virada para cima, de qualquer baralho de setor. Preste aten\xE7\xE3o no que os outros est\xE3o pegando: toda carta draftada \xE9 uma empresa que provavelmente ser\xE1 constru\xEDda, o que empurra o pre\xE7o daquele setor para baixo e o pre\xE7o dos fornecedores dele para cima antes mesmo de voc\xEA ter come\xE7ado."},{note:"Embaralhar os baralhos inteiros \xE9 o que coloca uma empresa grande ao alcance logo cedo, para um jogador disposto a pegar o empr\xE9stimo ou a vender pesado para banc\xE1-la. Tamb\xE9m significa que o draft n\xE3o pode ser planejado de antem\xE3o: o que est\xE1 no topo \xE9 sorte; o que voc\xEA faz a respeito n\xE3o \xE9."},{h:"O resto"},{ul:["Doze discos para cada jogador. Nada mais marca o que \xE9 seu.","Fichas de Megacorpora\xE7\xE3o: existem dezesseis, em quatro patamares de quatro. Duas s\xE3o sorteadas de cada patamar em jogo - tr\xEAs com cinco jogadores, todas as quatro com seis. Os patamares 4 e 3 est\xE3o sempre em jogo; o patamar 2 entra com tr\xEAs jogadores, e o patamar 1 s\xF3 com quatro.","As personas s\xE3o distribu\xEDdas a todos por padr\xE3o - uma para cada, sorteadas entre seis. Deixe-as de fora na primeira partida, se preferir."]},{note:"O draft em ordem inversa \xE9 o \xFAnico mecanismo de recupera\xE7\xE3o do jogo, e \xE9 pequeno de prop\xF3sito. O assento 4 em uma partida de quatro jogadores abre com $19 e tr\xEAs cartas contra os $25 e uma carta do assento 1 - o bastante para pesar nos dois primeiros trimestres, n\xE3o o bastante para decidir uma partida. Uma carta a mais custa exatamente $3, e assentos com o mesmo n\xFAmero de cartas ficam com o mesmo dinheiro. N\xE3o era assim que a tabela se lia antes: ela pagava $25/1, $25/2, $20/2, $20/3, o que dava ao terceiro assento as cartas do segundo assento por $5 a menos E o dinheiro do quarto assento com uma carta a menos - estritamente a pior cadeira da mesa, sem nada oferecido em troca. Medido ao longo de 500 partidas de quatro jogadores, isso mal importou (os assentos ficaram em 20.8 / 28.6 / 23.8 / 26.8 por cento, e trocar o dinheiro do segundo e do terceiro assento n\xE3o trocou os resultados deles, ent\xE3o os $5 nunca foram o que os movia). Est\xE1 corrigido porque o jogador consegue VER isso, n\xE3o porque estivesse lhe custando partidas."}]},{id:"discs",title:"Seus doze discos",blocks:[{p:"Seus discos s\xE3o toda a sua presen\xE7a no mundo. Voc\xEA tem doze, e cada um deles est\xE1 comprometido em algum lugar:"},{ul:["um disco em cada lote de terreno que voc\xEA possui,","um disco em cada empresa ativa que voc\xEA opera,","um disco no banco para cada empr\xE9stimo que voc\xEA n\xE3o quitou."]},{p:"Se voc\xEA n\xE3o tem nenhum disco livre, n\xE3o pode comprar terreno, fundar uma empresa, assumir uma estrutura em dificuldade nem pegar um empr\xE9stimo - por mais dinheiro que esteja segurando. Voc\xEA libera um disco vendendo um lote, vendendo uma empresa ou quitando um empr\xE9stimo."},{p:"\xC0 parte disso, voc\xEA tem cinco espa\xE7os de empresa. Toda empresa ativa ocupa um, e toda sede de Megacorpora\xE7\xE3o que voc\xEA tenha formado tamb\xE9m - uma sede n\xE3o opera mais, mas continua de p\xE9 no tabuleiro e continua segurando seu disco."},{note:"O limite de discos \xE9 o freio de verdade do jogo, n\xE3o o dinheiro. O dinheiro chega em enxurradas assim que seus fundos come\xE7am a pagar, e sem um teto r\xEDgido de presen\xE7a o l\xEDder simplesmente compraria o mapa. Doze discos tamb\xE9m fazem de vender terreno uma decis\xE3o de verdade, e n\xE3o uma perda pura. Eram dez at\xE9 a contagem ser medida: dez recusavam cerca de um quarto das tentativas de crescer de toda empresa horizontal por falta de disco, o que explica a maior parte do motivo de Manufatura, Servi\xE7os P\xFAblicos e Tecnologia passarem partidas inteiras no n\xEDvel 1. Doze levam isso a 18%. Quinze foi testado e comprou, na maior parte, espalhamento de terrenos."}]},{id:"quarter",title:"Um trimestre, passo a passo",blocks:[{p:"Todos os doze trimestres seguem as mesmas cinco fases. Planejamento e A\xE7\xE3o s\xE3o onde voc\xEA age; as fases seguintes se resolvem ao seu redor e s\xF3 param quando h\xE1 uma escolha a fazer - onde entregar, o que vender incompleto, onde vai o Centro Log\xEDstico, se quita ou n\xE3o um empr\xE9stimo."},{table:{head:["Fase","O que acontece"],rows:[["1. Planejamento","Todos colocam seus trabalhadores nas trilhas de a\xE7\xE3o."],["2. A\xE7\xE3o","As trilhas se resolvem e cada trabalhador executa suas a\xE7\xF5es."],["3. Produ\xE7\xE3o","Toda empresa ativa paga sua conta de fornecedores aos fundos dos setores e seu aluguel do terreno aos propriet\xE1rios dos lotes em que est\xE1."],["4. Receita","Voc\xEA entrega produ\xE7\xE3o aos \xEDcones de demanda em troca de dinheiro; depois, os fundos dos setores s\xE3o repartidos."],["5. Encerramento","Um novo Centro Log\xEDstico abre. No fim de cada ano, os dois pr\xEAmios de terras s\xE3o pagos."]]}}]},{id:"planning",title:"Planejamento: colocando trabalhadores",blocks:[{p:"Voc\xEA tem dois trabalhadores (tr\xEAs para cada um em uma partida de dois jogadores). Os jogadores colocam um trabalhador por vez, na ordem de turno, dando voltas at\xE9 que todos tenham colocado todos os seus."},{h:"As quatro trilhas"},{table:{head:["Trilha","Espa\xE7os","O que faz"],rows:[["Captar Recursos","4 / 5 / 6","Transforme bens em dinheiro - EMPR\xC9STIMO ou VENDER."],["M&A","4 / 5 / 6","Amplie sua presen\xE7a - FUNDAR ou COMPRAR."],["P&D","4 / 5 / 6","Melhore o que voc\xEA tem - PESQUISAR ou EXPANDIR."],["Reuni\xE3o do Conselho","2","ABRIR CAPITAL ou REPOSICIONAR. Consome todos os seus trabalhadores."]]}},{p:"As tr\xEAs trilhas de trabalho t\xEAm quatro espa\xE7os com dois, tr\xEAs ou quatro jogadores. Um quinto jogador abre um quinto espa\xE7o em cada uma delas, e um sexto jogador, um sexto. A Reuni\xE3o do Conselho fica em dois assentos, n\xE3o importa quantos estejam jogando - ela deve mesmo ser escassa."},{p:"O segundo assento da Reuni\xE3o do Conselho fica selado sob a ficha de IPO at\xE9 que algu\xE9m o reivindique abrindo capital."},{h:"\xDAltimo a entrar, primeiro a sair - a regra que pega todo mundo"},{p:"Os trabalhadores preenchem uma trilha da esquerda para a direita, mas a trilha se resolve da DIREITA PARA A ESQUERDA. Quem colocou por \xDALTIMO em uma trilha age PRIMEIRO nela."},{p:"Comprometer-se cedo \xE9 pago em a\xE7\xF5es: seu trabalhador executa uma a\xE7\xE3o, mais uma extra para cada trabalhador que pousar depois dele na mesma trilha. Um trabalhador sozinho em uma trilha que depois lota por completo executa tantas a\xE7\xF5es quantos forem os espa\xE7os da trilha - mas todos os que pousaram depois dele ter\xE3o agido primeiro, e podem ter levado exatamente o que ele estava esperando."},{p:"As trilhas em si se resolvem em uma ordem fixa: Captar Recursos, depois M&A, depois P&D, depois Reuni\xE3o do Conselho."},{h:"Reuni\xE3o do Conselho"},{p:"Ir \xE0 Reuni\xE3o do Conselho custa TODOS os seus trabalhadores do trimestre e compra uma \xFAnica a\xE7\xE3o. \xC9 um sacrif\xEDcio de verdade, e \xE9 para ser mesmo."},{note:"A coloca\xE7\xE3o de trabalhadores no esquema primeiro a entrar, \xFAltimo a sair \xE9 a espinha dorsal do jogo. \xC9 o \xFAnico mecanismo que faz a ordem de turno importar continuamente, e n\xE3o uma vez por rodada, e \xE9 por isso que Reposicionar vale dois trabalhadores para um jogador sentado no fim da ordem."}]},{id:"actions",title:"As a\xE7\xF5es",blocks:[{h:"Captar Recursos"},{ul:["EMPR\xC9STIMO - pegue $20 do banco e empenhe um disco. Voc\xEA pode comprar o disco de volta em um fim de ano; se nunca fizer isso, ele custa 5 EP no fim do jogo.","VENDER - um Projeto da sua m\xE3o ($4 / $8 / $12 conforme o n\xEDvel), uma empresa (metade do custo inicial, ou o custo cheio se ela tiver sido expandida - o pr\xE9dio vai para o banco como Ativo em Dificuldade), ou um lote pelo seu valor atual."]},{h:"M&A"},{ul:["FUNDAR - construa um Projeto da sua m\xE3o em lotes vazios, pagando o custo inicial dele. Na primeira vez que voc\xEA construir em um setor, voc\xEA embolsa 3 EP imediatamente.","COMPRAR - pegue qualquer lote sem dono pelo valor atual, ou assuma um Ativo em Dificuldade. H\xE1 duas formas de assumir um: RETOMAR como est\xE1, por exatamente o que o banco pagou por ele, mantendo seu Projeto e seu n\xEDvel e sem precisar de carta nenhuma, ou REFORMAR com uma carta da sua m\xE3o por metade do custo inicial dessa carta. Qualquer estrutura em dificuldade \xE9 alvo v\xE1lido, inclusive uma que voc\xEA mesmo vendeu."]},{p:"Retomar custa o que o banco pagou, ent\xE3o esse pre\xE7o se l\xEA pela forma como o pr\xE9dio foi parar l\xE1. Uma empresa vendida por Captar Recursos rendeu metade do custo inicial, ou o custo inicial cheio se tinha sido expandida - e \xE9 isso que custa retom\xE1-la. Uma empresa tomada pelo banco em uma insolv\xEAncia rendeu metade do que uma venda planejada teria pago, e \xE9 proporcionalmente barata de retomar. Uma empresa absorvida por uma Megacorpora\xE7\xE3o nunca foi paga, ent\xE3o seu pre\xE7o \xE9 o que ela teria rendido se o dono a tivesse vendido."},{note:"Isto foi uma m\xE1quina de imprimir dinheiro durante uma vers\xE3o. Vender uma empresa expandida embolsava o custo inicial CHEIO e compr\xE1-la de volta na sequ\xEAncia custava s\xF3 METADE, ent\xE3o um jogador podia vender e retomar o mesmo pr\xE9dio todo trimestre e simplesmente ser pago por isso, com o tabuleiro inalterado no fim. Cobrar de volta exatamente o que foi entregue faz a ida e volta fechar em zero: a \xFAnica coisa que isso custa agora s\xE3o as duas a\xE7\xF5es, que \xE9 como deve ser - desfazer uma decis\xE3o deve ser poss\xEDvel e n\xE3o deve ser de gra\xE7a."},{p:"Voc\xEA pode construir em lotes de outro jogador. Ele recebe o aluguel todo trimestre, mas a empresa \xE9 sua."},{p:"Uma reforma tem que caber na carca\xE7a que j\xE1 est\xE1 de p\xE9. A carta precisa ter o mesmo n\xEDvel da estrutura em dificuldade e, do n\xEDvel 2 para cima, tamb\xE9m o mesmo tipo de crescimento: uma estrutura horizontal de n\xEDvel 2 ou 3 se espalha por v\xE1rios lotes e n\xE3o pode ser reconstru\xEDda como vertical, nem o contr\xE1rio. No n\xEDvel 1 os dois tipos ocupam um \xFAnico lote, ent\xE3o uma carca\xE7a de n\xEDvel 1 aceita qualquer Projeto de n\xEDvel 1."},{p:"Reformar move os marcadores de pre\xE7o exatamente como fundar - o setor em que voc\xEA constr\xF3i DESCE $1 e cada fornecedor citado na nova carta SOBE $1 - porque uma reforma coloca uma empresa genuinamente nova na cidade. Retomar uma carca\xE7a como est\xE1 n\xE3o move nada. O pr\xE9dio n\xE3o mudou, e tampouco mudou o que a cidade consegue fornecer ou precisa comprar."},{note:'Essa diferen\xE7a \xE9 a raz\xE3o inteira de manter as duas como jogadas separadas, em vez de uma \xFAnica a\xE7\xE3o de "assumir". Retomar \xE9 o jeito barato e discreto de desfazer uma venda; reformar \xE9 o jeito caro, que muda o que a cidade produz, e fazer isso deve custar alguma coisa ao mercado.'},{h:"P&D"},{ul:["PESQUISAR - compre a carta do topo, virada para cima, de qualquer baralho de setor. O limite de m\xE3o \xE9 de cinco cartas.","EXPANDIR - pague de novo o custo inicial de uma empresa. A produ\xE7\xE3o e o OPEX dela dobram, e o n\xEDvel dela sobe um."]},{p:"Uma empresa horizontal (Servi\xE7os P\xFAblicos, Manufatura, Tecnologia) cresce para os lados: expandir exige um lote adjacente que esteja vazio e tenha dono - voc\xEA ou qualquer outro jogador, caso em que voc\xEA paga aluguel a ele, exatamente como ao construir. Uma empresa vertical (Varejo, Hotelaria, Sa\xFAde) empilha no lote que j\xE1 ocupa. Cada empresa pode ser expandida uma vez."},{p:"Adjacente significa compartilhar um lado - acima, abaixo, \xE0 esquerda ou \xE0 direita - estejam os dois lotes no mesmo distrito ou do outro lado da fronteira, no distrito seguinte. Lotes que se tocam apenas por um canto n\xE3o s\xE3o adjacentes, ent\xE3o uma empresa nunca pode ocupar os dois. A mesma regra decide onde uma empresa de v\xE1rios lotes pode ser constru\xEDda em primeiro lugar: seus lotes precisam formar uma \xFAnica forma conectada."},{h:"Reuni\xE3o do Conselho"},{ul:["ABRIR CAPITAL - fa\xE7a a fus\xE3o de empresas para reivindicar uma ficha de Megacorpora\xE7\xE3o. Voc\xEA s\xF3 pode usar esta a\xE7\xE3o se de fato tiver a combina\xE7\xE3o exata que uma das fichas dispon\xEDveis pede.","REPOSICIONAR - v\xE1 para o primeiro lugar na ordem de turno e coloque seus trabalhadores juntos no in\xEDcio do planejamento do pr\xF3ximo trimestre (dois dos seus tr\xEAs em uma mesa de dois jogadores)."]},{p:"A ficha de IPO n\xE3o \xE9 uma a\xE7\xE3o que voc\xEA possa usar. Ela \xE9 o pr\xEAmio por ser o primeiro: quem formar a primeira Megacorpora\xE7\xE3o da partida tamb\xE9m a leva. Ela \xE9 um SEXTO espa\xE7o de empresa - ent\xE3o ser o primeiro a fazer uma fus\xE3o n\xE3o estreita o quanto voc\xEA pode operar - e \xE9 o que abre o segundo assento da Reuni\xE3o do Conselho pelo resto da partida. At\xE9 l\xE1, s\xF3 um jogador pode ocupar este assento a cada trimestre, e um jogador que n\xE3o consegue formar uma Megacorpora\xE7\xE3o s\xF3 tem Reposicionar dispon\xEDvel."}]},{id:"land",title:"Terrenos e pr\xE9dios",blocks:[{h:"Quanto custa um lote"},{p:"O valor de um lote \xE9 o pre\xE7o de via impresso nele mais $1 por lote ocupado que o toque - cantos inclusive, dentro de um distrito - mais $1 se ele tocar um Centro Log\xEDstico. Os pre\xE7os de via v\xE3o de 1 na borda externa a 6 bem no centro da cidade. Voc\xEA paga esse valor para comprar e o recebe ao vender - ent\xE3o terreno perto da a\xE7\xE3o de fato se valoriza conforme a cidade se preenche."},{h:"\xC1rea ocupada"},{p:"Uma empresa vertical sempre ocupa exatamente um lote, seja qual for o n\xEDvel dela. Uma empresa horizontal ocupa um lote por n\xEDvel, e esses lotes precisam formar um grupo conectado de terreno vazio e com dono - n\xE3o precisa ser seu, embora o dono v\xE1 receber o aluguel. Um Projeto horizontal de n\xEDvel 3, portanto, exige tr\xEAs lotes vazios conectados para sequer poder ser constru\xEDdo."},{p:"Um lote pode sustentar mais de um n\xEDvel, e o aluguel acompanha os n\xEDveis, n\xE3o os lotes: $2 por n\xEDvel erguido sobre um lote, pagos ao propriet\xE1rio daquele lote. Quando uma persona permite que uma empresa cres\xE7a no sentido contr\xE1rio - Tecnologia empilhando em vez de se espalhar, Hotelaria se espalhando em vez de empilhar - voc\xEA escolhe em qual lote da \xE1rea ocupada o novo n\xEDvel vai. Empilhe em terreno seu e o aluguel desses n\xEDveis volta para voc\xEA."},{note:"O aluguel era $3 por n\xEDvel e agora \xE9 $2. O aluguel e a conta de fornecedores s\xE3o cobrados separadamente, mas juntos ainda somam exatamente o que o Projeto cobra, ent\xE3o a taxa decide uma DIVIS\xC3O, e n\xE3o um custo: a $3 os propriet\xE1rios dos lotes ficavam com 57 centavos de cada d\xF3lar de OPEX e os fundos dos setores com 43; a $2 \xE9 38 e 62. Medido: o jogador que lidera na metade da partida passa a vencer 36% dos jogos de quatro jogadores em vez de 41%, e 28% dos jogos de seis jogadores em vez de 31%, sem mudan\xE7a na pontua\xE7\xE3o vencedora nem no equil\xEDbrio entre os setores. O JOGO DE DOIS JOGADORES \xC9 A EXCE\xC7\xC3O e vai para o outro lado, de 60% para 67%: com apenas dois assentos, n\xE3o h\xE1 mais ningu\xE9m entre quem espalhar o al\xEDvio. $2 \xE9 um \xF3timo medido, e n\xE3o uma dire\xE7\xE3o a seguir - a $1 o l\xEDder da metade vence 47% dos jogos de quatro jogadores e 38% dos de seis, pior do que $3 jamais foi, ent\xE3o o ganho n\xE3o continua se descermos mais. Veja audit_rent_one.js, audit_rent_scaled.js e audit_rent_flow.js."},{h:"Vender o terreno debaixo de um pr\xE9dio"},{p:"Uma empresa s\xF3 produz enquanto todo lote em que ela se apoia tiver ALGU\xC9M como dono - n\xE3o necessariamente voc\xEA. Vender um desses lotes n\xE3o destr\xF3i o pr\xE9dio, mas ele para de produzir at\xE9 que algu\xE9m compre aquele terreno, e quem comprar passa a receber o aluguel dele da\xED em diante. As contas dele continuam sendo cobradas enquanto ele fica parado."},{note:"Essa regra existe para que um jogador desesperado tenha mais uma coisa para vender sem perder a empresa na hora, e para que valha a pena ficar de olho no terreno em dificuldade de um advers\xE1rio. Voc\xEA s\xF3 pode vender o seu pr\xF3prio terreno - mas, se um rival construiu em um lote seu, vend\xEA-lo realmente interrompe o pr\xE9dio dele at\xE9 que o terreno seja comprado de novo, ent\xE3o terreno sob a empresa de outra pessoa \xE9 alavancagem."}]},{id:"prices",title:"Pre\xE7os, oferta e demanda",blocks:[{p:"Cada setor tem um \xFAnico pre\xE7o de mercado pelo qual todo mundo vende. Ele come\xE7a no seu pre\xE7o base e se move conforme a cidade \xE9 constru\xEDda."},{table:{head:["Setor","Pre\xE7o base","Crescimento"],rows:[["Servi\xE7os P\xFAblicos (UT)","$4","Horizontal"],["Varejo (RE)","$4","Vertical"],["Hotelaria (HO)","$5","Vertical"],["Manufatura (MA)","$5","Horizontal"],["Sa\xFAde (HC)","$6","Vertical"],["Tecnologia (TE)","$6","Horizontal"]]}},{h:"Como o pre\xE7o se move"},{p:"Cada setor tem um marcador em uma trilha de pre\xE7os que vai de $2 a $12. Cada evento vale um d\xF3lar inteiro: uma empresa constru\xEDda faz o pr\xF3prio setor dela DESCER $1, e cada fornecedor que essa empresa passa a pagar SOBE $1. O marcador cai sobre um n\xFAmero todas as vezes."},{p:"Fundar uma empresa move DOIS marcadores, e ambos um d\xF3lar inteiro. Todo setor impresso como FORNECEDOR no Projeto dela SOBE $1, porque a nova empresa vai comprar dele. O setor da pr\xF3pria empresa DESCE $1, porque agora h\xE1 mais daquele bem \xE0 venda. Um setor que \xE9 constru\xEDdo com a mesma frequ\xEAncia com que \xE9 necess\xE1rio fica exatamente onde est\xE1."},{p:"N\xE3o h\xE1 nada para lembrar entre um evento e outro e nada escondido: uma empresa constru\xEDda, um d\xF3lar a menos no setor dela; um fornecedor citado, um d\xF3lar a mais nesse fornecedor. A taxa \xE9 a mesma nos dois sentidos, e o marcador sempre cai sobre um n\xFAmero impresso."},{p:"O marcador para nas extremidades. Em $12 ele n\xE3o sobe mais, e em $2 ele n\xE3o desce mais, mas se move para o outro lado no instante em que algo o empurra - um marcador parado em $12 sai de $12 assim que uma empresa \xE9 constru\xEDda ali."},{note:"As extremidades serem barreiras r\xEDgidas \xE9 a raz\xE3o de isto ser um marcador em uma trilha, e n\xE3o uma contagem corrente. Contar oferta e demanda separadamente permitia que um setor que 'deveria' estar em $14 ficasse em $10 carregando um excesso invis\xEDvel, de modo que quatro empresas precisavam ser constru\xEDdas antes que o pre\xE7o se movesse um centavo. Um marcador n\xE3o consegue esconder nada: o que voc\xEA v\xEA na trilha \xE9 o estado inteiro."},{p:"Um setor lotado pode afundar at\xE9 $2. Isso ainda \xE9 o dobro do $1 que voc\xEA recebe por reciclar mercadorias que n\xE3o conseguiu vender, ent\xE3o vender sempre \xE9 melhor do que sucatear - o que n\xE3o era verdade quando a trilha terminava na taxa de reciclagem. Um setor negligenciado do qual metade da mesa depende sobe r\xE1pido, e $12 \xE9 genuinamente alcan\xE7\xE1vel."},{note:"O d\xF3lar inteiro por evento j\xE1 tinha sido testado e abandonado uma vez, e vale saber por que ele funciona agora. Sozinho, ele inflava a cidade: a pontua\xE7\xE3o vencedora com seis assentos foi de 111 para 173, o dinheiro guardado por assento mais que dobrou, e a vantagem do vencedor sobre o segundo colocado praticamente dobrou. Mas o diagn\xF3stico estava errado. O problema nunca foi o passo - era pontuar uma economia dobrada a uma taxa definida para a economia antiga. O passo est\xE1 de volta, desta vez com cada pre\xE7o base $2 mais alto, a trilha indo de $2..$12 para que as bases elevadas tenham para onde ir, e o dinheiro convertendo a $50 por EP em vez de $20. Medido ao longo de 2250 partidas: o faturamento sobe 83% e a pontua\xE7\xE3o vencedora fica a menos de 2% de onde estava. Passos de meio d\xF3lar compravam uma pontua\xE7\xE3o est\xE1vel deixando o mercado quieto demais para ser lido - agora todo setor \xE9 negociado abaixo do pr\xF3prio pre\xE7o base com frequ\xEAncia suficiente para importar, a Tecnologia em 17% das partidas contra 3%, e as duas pontas da trilha s\xE3o alcan\xE7\xE1veis sem que nenhuma delas seja um muro. Veja audit_full_dollar_step.js, audit_price_floor.js e audit_base_plus_two.js."},{h:"Quanto cada empresa custa e produz"},{p:"Custo inicial / OPEX / Produ\xE7\xE3o, por n\xEDvel."},{table:{head:["Setor","N\xEDvel 1","N\xEDvel 2","N\xEDvel 3"],rows:[["Servi\xE7os P\xFAblicos (UT)","15 / 4 / 4","20 / 7 / 8","30 / 10 / 16"],["Varejo (RE)","10 / 5 / 4","15 / 9 / 8","25 / 14 / 16"],["Hotelaria (HO)","10 / 6 / 3","15 / 10 / 6","25 / 16 / 12"],["Manufatura (MA)","20 / 4 / 3","35 / 7 / 6","60 / 10 / 12"],["Sa\xFAde (HC)","20 / 5 / 2","35 / 9 / 4","60 / 14 / 8"],["Tecnologia (TE)","15 / 6 / 2","25 / 10 / 4","40 / 16 / 8"]]}},{h:"Quem paga a quem"},{p:"Toda empresa paga uma conta de fornecedores - o OPEX impresso dela menos $2 por n\xEDvel de aluguel do terreno - a empresas de outros setores: seus fornecedores, impressos no Projeto dela. A cadeia fecha um ciclo, ent\xE3o nenhum setor \xE9 um beco sem sa\xEDda. Cartas de n\xEDvel 1 t\xEAm um fornecedor, as de n\xEDvel 2 t\xEAm dois, e as de n\xEDvel 3 t\xEAm os tr\xEAs."},{table:{head:["Setor","Fornecedor 1","Fornecedor 2","Fornecedor 3"],rows:[["Servi\xE7os P\xFAblicos","HO","TE","HC"],["Varejo","TE","HO","MA"],["Hotelaria","MA","HC","RE"],["Manufatura","HC","RE","UT"],["Sa\xFAde","RE","UT","TE"],["Tecnologia","UT","MA","HO"]]}},{p:"Os tr\xEAs n\xE3o s\xE3o igualmente comuns: entre os dez Projetos de um setor, o primeiro fornecedor aparece com mais frequ\xEAncia e o terceiro com menos. Leia o Projeto \xE0 sua frente, e n\xE3o a tabela."},{note:"A simetria - uma constru\xE7\xE3o eleva cada fornecedor um passo e derruba o pr\xF3prio setor um passo - \xE9 o que impede uma disparada. Ela faz com que ser o segundo a construir em um setor seja muito melhor do que ser o quinto, mas tamb\xE9m faz com que abastecer um setor lotado pague mais a cada vez que algu\xE9m entra nele."}]},{id:"production",title:"Produ\xE7\xE3o: pagar as contas",blocks:[{p:"Toda empresa ativa paga duas contas a cada trimestre, automaticamente, venda ela alguma coisa depois ou n\xE3o:"},{ul:["Sua CONTA DE FORNECEDORES vai para os fundos dos setores dos fornecedores impressos em seu Projeto, dividida na propor\xE7\xE3o dos valores de depend\xEAncia.","Seu ALUGUEL DO TERRENO - $2 por n\xEDvel instalado em um lote - vai para quem for dono daquele lote. Uma empresa vertical empilha todos os seus n\xEDveis em um \xFAnico lote, ent\xE3o todo o aluguel dela vai para um s\xF3 propriet\xE1rio do lote; uma horizontal coloca um n\xEDvel em cada lote que ocupa, ent\xE3o cada propriet\xE1rio do lote recebe $2. Voc\xEA n\xE3o paga nada por ocupar terreno pr\xF3prio."]},{note:"Isso antes era um pagamento s\xF3, dividido em dois: a empresa pagava todo o seu OPEX, o propriet\xE1rio do lote tirava $2 por n\xEDvel dali, e s\xF3 o restante chegava aos fundos - ou seja, em terreno pr\xF3prio voc\xEA solenemente pagava a si mesmo e pegava o dinheiro de volta. O dinheiro \xE9 o mesmo. Duas contas, cada uma indo para um lugar, \xE9 simplesmente o que uma mesa consegue fazer sem calculadora. As sedes de Megacorpora\xE7\xE3o sempre foram cobradas assim, ent\xE3o \xE9 o resto do tabuleiro se equiparando a elas. Uma coisa mudou de fato: uma empresa instalada em terreno de ningu\xE9m antes era cobrada por um aluguel que n\xE3o chegava a propriet\xE1rio nenhum e sumia. N\xE3o h\xE1 propriet\xE1rio do lote, ent\xE3o agora ela n\xE3o paga aluguel."},{h:"Se voc\xEA n\xE3o puder pagar"},{p:"Antes de o OPEX ser cobrado, todo jogador cujo dinheiro n\xE3o cobrir a conta inteira ganha uma janela de emerg\xEAncia para escolher o que vender. Essa \xE9 uma venda for\xE7ada e tudo nela sai pela METADE do que uma venda planejada via Captar Recursos renderia: Projetos a $2 / $4 / $6 conforme o n\xEDvel, lotes por metade do valor, uma empresa por metade do que teria rendido numa venda volunt\xE1ria. O que voc\xEA continua controlando \xE9 quais bens v\xE3o embora, n\xE3o o pre\xE7o."},{p:"Se voc\xEA fechar a janela com a conta ainda descoberta, o banco vende por voc\xEA por essas mesmas taxas pela metade - Projetos primeiro, depois seus lotes mais baratos, depois suas empresas mais fracas - e, se ainda assim n\xE3o bastar quando a conta de uma empresa vencer, essa empresa entra em INSOLV\xCANCIA: todo o resto que voc\xEA tiver sai pela metade, e a empresa que causou isso vai para o banco como Ativo em Dificuldade."},{note:"Vender a pre\xE7o cheio sob press\xE3o tornava a janela de emerg\xEAncia estritamente melhor do que se planejar - dava para ignorar o OPEX, esperar ser for\xE7ado e n\xE3o perder nada. \xC9 a redu\xE7\xE3o pela metade que faz a trilha Captar Recursos valer um trabalhador."},{note:"A liquida\xE7\xE3o for\xE7ada paga exatamente metade de uma venda volunt\xE1ria, em todos os casos. Ficar sem dinheiro deve doer o bastante para que os jogadores mantenham uma reserva, sem virar uma espiral da morte - um evento de insolv\xEAncia costuma custar a um jogador um trimestre, n\xE3o a partida."}]},{id:"revenue",title:"Receita: vender o que voc\xEA produz",blocks:[{p:"Cada empresa produz um n\xFAmero de unidades impresso em seu Projeto, dobrado se ela tiver sido expandida. Esse n\xFAmero \xE9 tudo o que ela tem: toda habilidade abaixo \xE9 um caminho para essas unidades, nunca uma fonte de mais unidades. Voc\xEA as entrega a \xEDcones de demanda que sua empresa consegue alcan\xE7ar, e cada unidade que um \xEDcone recebe \xE9 paga pelo pre\xE7o de mercado atual do seu setor."},{p:"Os \xEDcones de demanda s\xE3o por ordem de chegada; os neg\xF3cios para os quais uma empresa de Hotelaria vende, n\xE3o - ent\xE3o em geral vale pegar primeiro os \xEDcones disputados e mandar o que sobrar para os vizinhos. Tudo o que ainda assim voc\xEA n\xE3o conseguir colocar \xE9 reciclado por $1 a unidade."},{p:"A entrega segue a ordem de turno. Todo \xEDcone \xE9 por ordem de chegada, ent\xE3o estar no in\xEDcio da ordem vale dinheiro de verdade num distrito disputado - e \xE9 a principal coisa que REPOSICIONAR compra para voc\xEA."},{h:"Quais \xEDcones voc\xEA pode usar"},{p:"Todo distrito mostra uma grade de demanda 4x4. Cada linha \xE9 um setor; as quatro colunas s\xE3o os n\xEDveis 1 a 4. Voc\xEA pode entregar a um \xEDcone se o setor da linha for o seu e a coluna n\xE3o for maior que o n\xEDvel da sua empresa - ent\xE3o uma empresa maior alcan\xE7a mais fundo no mesmo distrito, e os \xEDcones mais fundos s\xE3o mais famintos."},{ul:["As linhas 3 e 4 de todo distrito ficam fechadas at\xE9 o Trimestre 5.","No fim do Trimestre 8, toda a grade de demanda \xE9 limpa e todos os \xEDcones reabrem para o Ano 3.","UM \xCDCONE RECEBE A PR\xD3PRIA COLUNA EM MERCADORIAS: o \xEDcone de n\xEDvel 1 recebe uma unidade, o de n\xEDvel 2 duas, o de n\xEDvel 3 tr\xEAs, o de n\xEDvel 4 quatro. Uma empresa de n\xEDvel 3 que alcan\xE7a as colunas 1, 2 e 3 vende, portanto, 1 + 2 + 3 = 6 unidades em uma \xFAnica linha limpa do seu setor.","Cada \xEDcone pode receber uma venda s\xF3, de quem chegar primeiro - e \xE9 preenchido por inteiro, n\xE3o importa quantas unidades tenha exigido, embora voc\xEA s\xF3 receba pelas unidades que de fato tinha.","Tudo o que voc\xEA n\xE3o conseguir vender \xE9 reciclado por $1 a unidade."]},{h:"At\xE9 onde uma empresa alcan\xE7a"},{p:"Uma empresa sempre pode vender no distrito ou nos distritos onde est\xE3o seus pr\xF3prios lotes. Al\xE9m disso:"},{ul:["Centros Log\xEDsticos ficam em lotes. Se qualquer lote da \xE1rea ocupada pela sua empresa for ortogonalmente vizinho de um centro - at\xE9 quatro lotes podem ser, j\xE1 que os cantos n\xE3o contam - sua empresa entra na rede log\xEDstica e alcan\xE7a todos os distritos em que haja algum centro do tabuleiro. Uma sede de Megacorpora\xE7\xE3o conta como centro para isso, ent\xE3o construir ao lado do monumento alheio tamb\xE9m coloca voc\xEA na rede.","Servi\xE7os P\xFAblicos e Varejo nunca podem usar centros, de jeito nenhum.","Sa\xFAde j\xE1 est\xE1 na rede log\xEDstica por natureza - alcan\xE7a todo distrito com centro sem precisar encostar em nenhum."]},{h:"Habilidades dos setores"},{table:{head:["Setor","Habilidade"],rows:[["Servi\xE7os P\xFAblicos","L\xEA a demanda em um bloco de distritos t\xE3o largo quanto o seu n\xEDvel, posicionado em qualquer lugar que ainda cubra a pr\xF3pria \xE1rea ocupada. Nunca usa centros."],["Varejo","Vende em um distrito extra \xE0 sua escolha por n\xEDvel. Nunca usa centros."],["Hotelaria","Pode vender aos neg\xF3cios e centros ao seu redor em vez de vender a \xEDcones de demanda - uma unidade a pre\xE7o de mercado para cada neg\xF3cio ou centro dentro do seu n\xEDvel em lotes, sem precisar de \xEDcone. Essas unidades saem da produ\xE7\xE3o dela como quaisquer outras."],["Manufatura","Pode direcionar at\xE9 o seu n\xEDvel em unidades para as linhas de OUTROS setores no pr\xF3prio distrito. Essas unidades saem da produ\xE7\xE3o dela - a venda cruzada \xE9 um lugar para mandar mercadorias, n\xE3o mercadorias a mais."],["Sa\xFAde","Alcan\xE7a todo distrito na rede log\xEDstica sem encostar em um centro."],["Tecnologia","Todo \xEDcone que ela preenche recebe o dobro da sua coluna em unidades - 2, 4, 6 ou 8 - e paga por todas elas."]]}},{h:"B2B: os fundos pagam"},{p:"Cada fundo \xE9 dividido igualmente entre as empresas daquele setor - uma parte igual para cada uma, do tamanho que essas empresas forem. Quem \xE9 pago \xE9 o setor, n\xE3o o pr\xE9dio. Uma sede de Megacorpora\xE7\xE3o conta aqui: ela n\xE3o produz nada, mas o setor paga a parte dela mesmo assim."},{p:"O que n\xE3o dividir certinho fica no fundo e passa adiante. Um fundo de $10 dividido entre tr\xEAs empresas de Sa\xFAde paga $3 a cada uma e leva $1 para o trimestre seguinte."},{p:"Um fundo sem nenhuma empresa daquele tipo para pagar passa adiante por inteiro, crescendo trimestre a trimestre. Um setor que ningu\xE9m atende \xE9 muitas vezes a coisa mais lucrativa do tabuleiro."},{note:"O dobrador da Tecnologia e o b\xF4nus de vizinhan\xE7a da Hotelaria s\xE3o as duas habilidades que escalam com o tabuleiro, e n\xE3o com a carta, e s\xE3o o motivo de esses dois setores parecerem fracos no papel e jogarem forte. Servi\xE7os P\xFAblicos era originalmente 'dist\xE2ncia menor que o n\xEDvel a partir de qualquer distrito de origem', o que discretamente deixava uma empresa de Servi\xE7os P\xFAblicos de n\xEDvel 3 enxergar a cidade inteira; agora ela l\xEA um bloco N x N honesto."}]},{id:"closing",title:"Encerramento e o fim de ano",blocks:[{p:"Todo trimestre termina com a constru\xE7\xE3o de um novo Centro Log\xEDstico em um lote vazio que n\xE3o pertence a ningu\xE9m. O primeiro jogador na ordem de turno escolhe qual. Aquele lote fica ocupado para sempre - nada mais pode ser constru\xEDdo ali - e o centro acrescenta o pr\xF3prio distrito \xE0 rede log\xEDstica."},{h:"No fim dos Trimestres 4, 8 e 12"},{ul:["O Magnata Imobili\xE1rio e O Onipresente s\xE3o concedidos - 5 EP cada um ao l\xEDder isolado com 2-3 jogadores, 10 EP cada um com 4 ou mais. Eles tamb\xE9m s\xE3o pagos no trimestre final se a partida for encerrada antes do Q12.","Voc\xEA pode recomprar discos de empr\xE9stimo: $30 no fim do Ano 1, $35 no Ano 2, $40 no Ano 3."]},{p:"As empresas n\xE3o esperam o fim de ano. Uma empresa pontua no instante em que fica pronta - veja abaixo - ent\xE3o, quando um ano termina, os EP dela j\xE1 est\xE3o embolsados. O que um fim de ano decide \xE9 quem est\xE1 com a cidade na m\xE3o."},{h:"As empresas pontuam ao ficarem prontas"},{p:"No instante em que uma empresa \xE9 constru\xEDda, ela pontua 2 EP por n\xEDvel, direto para o seu bolso. No instante em que \xE9 expandida, pontua de novo pelo novo n\xEDvel, de novo direto para o seu bolso. \xC9 uma pontua\xE7\xE3o por constru\xE7\xE3o e uma por expans\xE3o - do mesmo jeito que entrar em um setor paga voc\xEA no momento em que voc\xEA constr\xF3i ali, n\xE3o em alguma contagem posterior."},{p:"Ent\xE3o uma empresa de n\xEDvel 2 constru\xEDda e depois expandida paga 4 EP no dia em que abre e mais 6 no dia em que cresce."},{p:"N\xE3o h\xE1 nada retido nem nada para controlar nas cartas: todo EP que voc\xEA ganhou est\xE1 embolsado, e a classifica\xE7\xE3o \xE9 a pontua\xE7\xE3o. Voc\xEA nunca perde EP que j\xE1 pontuou - nem quando uma empresa \xE9 vendida, nem quando ela entra em dificuldade, nem quando \xE9 fundida em uma Megacorpora\xE7\xE3o. Uma carca\xE7a em dificuldade que seja retomada pontua os n\xEDveis dela de novo para o novo dono, ent\xE3o uma empresa pode pontuar duas vezes na vida."},{note:"Dois EP por n\xEDvel, pagos na conclus\xE3o, \xE9 a mudan\xE7a que fez a constru\xE7\xE3o parecer o ponto do jogo, e n\xE3o um jeito de financiar os pr\xEAmios de terras. A 1 EP por n\xEDvel, pago um ou dois trimestres depois, uma empresa tinha de sobreviver para valer alguma coisa e ainda assim perdia para o dinheiro; agora o ato de construir \xE9 a recompensa, e o risco de um evento de insolv\xEAncia tardio n\xE3o devora mais isso."},{note:"Os EP antes ficavam na carta da empresa at\xE9 serem liberados - na expans\xE3o, na venda, na fus\xE3o ou no fim da partida. Isso nunca mudou uma \xFAnica pontua\xE7\xE3o final, porque a classifica\xE7\xE3o sempre contava as cartas tamb\xE9m e nada conseguia tirar uma carta da mesa sem antes liberar seus EP, ent\xE3o tudo o que isso comprava era uma segunda pilha para manter em ordem e uma pergunta - 'isso j\xE1 foi liberado?' - sem nada dependendo da resposta. Agora os EP v\xE3o direto para onde sempre iam parar."}]},{id:"megacorp",title:"Abrir capital e Megacorpora\xE7\xF5es",blocks:[{p:"Abrir capital significa sempre fundir empresas para reivindicar uma ficha de Megacorpora\xE7\xE3o, desde a primeir\xEDssima vez que isso \xE9 feito. Cada ficha indica uma combina\xE7\xE3o de n\xEDveis de empresa e paga entre 8 e 22 EP; voc\xEA precisa ter pelo menos aquelas empresas, e as que sobrarem da combina\xE7\xE3o continuam suas. Se suas empresas servirem para mais de uma ficha, reivindica-se a que paga mais; o que voc\xEA escolhe \xE9 qual das empresas fundidas vira a sede."},{p:"Quem formar a primeira Megacorpora\xE7\xE3o da partida leva tamb\xE9m a ficha de IPO: um sexto espa\xE7o de empresa pelo resto da partida, e o segundo assento da Reuni\xE3o do Conselho abre para todos."},{h:"O que uma fus\xE3o faz"},{ul:["Voc\xEA escolhe uma das empresas fundidas para virar a sede da Megacorpora\xE7\xE3o. Ela mant\xE9m o pr\xE9dio e devolve o Projeto ao baralho do seu setor.","Todas as outras v\xE3o para o banco como Ativos em Dificuldade - qualquer um pode assumi-las depois.","A sede para de operar: sem Projeto, n\xE3o produz nada e n\xE3o paga OPEX. Ela ainda recebe sua parte igual do fundo do seu setor em todo B2B - uma sede que parou de construir n\xE3o parou de receber.","A cada trimestre em que estiver de p\xE9, a sede embolsa EP igual ao PRE\xC7O ATUAL do seu setor DIVIDIDO PELO PATAMAR DA FICHA, arredondado para baixo. Uma sede de patamar 1 em um setor a $3 embolsa 3 EP por trimestre; uma sede de patamar 4 no mesmo setor n\xE3o embolsa nada at\xE9 aquele setor chegar a $4. Uma sede em um setor que ningu\xE9m atende vai ganhando discretamente enquanto o pre\xE7o sobe, e uma formada no Ano 1 arrecada por oito trimestres a mais do que uma formada no Ano 3.","Ela n\xE3o tem conta de fornecedores, mas continua ocupando o terreno, ent\xE3o o dono dela paga aluguel do terreno todo trimestre como qualquer outro pr\xE9dio - $2 por n\xEDvel instalado em um lote, ao propriet\xE1rio daquele lote. Em terreno pr\xF3prio, nada \xE9 devido.","Uma sede \xE9 infraestrutura p\xFAblica: conta como Centro Log\xEDstico. Qualquer empresa constru\xEDda ortogonalmente ao lado de uma entra na rede log\xEDstica por meio dela, seja de quem for. Um monumento que s\xF3 arrecadasse seria um monumento ao lado do qual ningu\xE9m ia querer construir - e as empresas que se juntam em volta dele s\xE3o exatamente aquelas a quem ele paga um d\xEDzimo.","Venda um lote debaixo de uma sede e ela n\xE3o arrecada mais nada - sem parte do fundo, sem pontos, e deixa de ser um centro. Um monumento ainda precisa do seu terreno.","Ela mant\xE9m o disco e trava permanentemente um dos seus cinco espa\xE7os de empresa. Cada Megacorpora\xE7\xE3o que voc\xEA forma reduz o quanto voc\xEA pode operar em largura.","A cada trimestre em que estiver de p\xE9, a sede paga 1 EP a cada empresa RIVAL que estiver ortogonalmente ao lado dela, e o dono daquela empresa o embolsa. Suas PR\xD3PRIAS empresas ao lado da sua pr\xF3pria sede n\xE3o custam nada a voc\xEA - elas s\xE3o pagas e voc\xEA \xE9 cobrado no mesmo instante, o que se anula. Ent\xE3o uma sede encravada no distrito alheio sangra a partida inteira, e onde voc\xEA a coloca \xE9 uma aposta em quem vai construir do seu lado."]},{p:"Oito fichas ficam em jogo numa mesa de quatro jogadores, doze com cinco e todas as dezesseis com seis, ent\xE3o a combina\xE7\xE3o que voc\xEA est\xE1 montando em geral ainda est\xE1 l\xE1, mas as que pagam mais s\xE3o disputadas."},{h:"As fichas"},{table:{head:["Megacorpora\xE7\xE3o","Exige","Empresas","Valor"],rows:[["Local Syndicate","3 x L1","3","8 EP"],["Founders\u2019 Pact","2 x L1 + 1 x L2","3","9 EP"],["Continental Holdings","4 x L1","4","10 EP"],["Twin Ventures","1 x L1 + 2 x L2","3","10 EP"],["Silent Merger","3 x L2","3","11 EP"],["Neighborhood Holdings","3 x L1 + 1 x L2","4","12 EP"],["Regional Consolidated","2 x L2 + 1 x L3","3","13 EP"],["Crosstown Alliance","2 x L1 + 2 x L2","4","13 EP"],["Metro Trust","1 x L2 + 2 x L3","3","14 EP"],["Crossroads Deal","1 x L1 + 3 x L2","4","14 EP"],["Skyline Consolidated","3 x L3","3","15 EP"],["Apex Group","2 x L2 + 2 x L3","4","16 EP"],["Titan Industries","2 x L3 + 1 x L4","3","17 EP"],["Colossus Group","4 x L3","4","19 EP"],["Empire Holdings","1 x L2 + 2 x L3 + 1 x L4","4","20 EP"],["Omnicorp","3 x L3 + 1 x L4","4","22 EP"]]}},{p:"Uma empresa de n\xEDvel 4 \xE9 uma que foi expandida a partir do n\xEDvel 3, ent\xE3o as fichas mais ricas exigem empresas que voc\xEA j\xE1 pagou para crescer."},{h:"Os quatro patamares"},{p:"As dezesseis fichas s\xE3o quatro patamares de quatro. O patamar 4 s\xE3o as quatro mais baratas de montar e o patamar 1 as quatro mais dif\xEDceis, e o patamar faz duas coisas: decide quais fichas est\xE3o na caixa e divide o que a sede ganha."},{table:{head:["Patamar","Fichas","Em jogo a partir de","Um setor a $3 embolsa","Um setor a $6 embolsa"],rows:[["4","Local Syndicate, Founders\u2019 Pact, Continental Holdings, Twin Ventures","2 jogadores","0 EP","1 EP"],["3","Silent Merger, Neighborhood Holdings, Regional Consolidated, Crosstown Alliance","2 jogadores","1 EP","2 EP"],["2","Metro Trust, Crossroads Deal, Skyline Consolidated, Apex Group","3 jogadores","1 EP","3 EP"],["1","Titan Industries, Colossus Group, Empire Holdings, Omnicorp","4 jogadores","3 EP","6 EP"]]}},{p:"As fichas s\xE3o sorteadas de todos os patamares que estiverem em jogo, e quantas depende da mesa: DUAS de cada patamar com dois, tr\xEAs ou quatro jogadores, TR\xCAS com cinco, e com seis jogadores toda ficha do jogo fica dispon\xEDvel. Ent\xE3o a caixa tem quatro fichas com dois jogadores, seis com tr\xEAs, oito com quatro, doze com cinco e todas as dezesseis com seis."},{note:"O sorteio mais amplo com cinco e seis jogadores n\xE3o \xE9 variedade por variedade. Uma segunda Megacorpora\xE7\xE3o convoca o trimestre final, e as mesas maiores s\xE3o as que t\xEAm mais motivo para querer essa porta aberta - doze trimestres com seis pessoas deliberando \xE9 uma noite longa. Com a caixa cheia em jogo, uma segunda fus\xE3o passa a ser algo que se pode procurar, em vez de uma quest\xE3o de as duas fichas que voc\xEA poderia usar terem sido sorteadas ou n\xE3o: as partidas que terminam cedo v\xE3o de 8% com quatro jogadores para 21% com cinco e 36% com seis, e a partida m\xE9dia de seis jogadores acaba cerca de dois ter\xE7os de trimestre mais cedo. O prazo \xE9 CONVOCADO com muito mais frequ\xEAncia do que morde - 82% das partidas de seis jogadores contra 25% das de quatro - porque uma segunda Megacorpora\xE7\xE3o que cai no Q11 ou no Q12 nomeia um trimestre final que a partida ia jogar de qualquer jeito."},{note:"Antes dos patamares, um Local Syndicate montado com tr\xEAs empresas de n\xEDvel 1 ganhava por trimestre exatamente o mesmo que um Omnicorp montado com quatro de n\xEDvel 3, e a Megacorpora\xE7\xE3o havia crescido at\xE9 33% de uma pontua\xE7\xE3o vencedora - o maior bloco isolado do jogo, \xE0 frente das empresas. Dividir o EP de marca pelo patamar cortou isso pela metade, para 17%, e baixou a vantagem do vencedor sobre o \xFAltimo de 58.6 EP para 48.7, sem tornar a fus\xE3o em si mais rara. A regra de sorteio quase n\xE3o pesa com quatro jogadores, onde oito fichas aleat\xF3rias de dezesseis j\xE1 d\xE3o em m\xE9dia duas por patamar; ela se paga com dois, onde tirou da caixa as fichas imposs\xEDveis de reivindicar e as Megacorpora\xE7\xF5es formadas subiram de 1.00 por partida para 1.26."},{note:"Uma fus\xE3o deve ser uma decis\xE3o de verdade, n\xE3o um b\xF4nus gr\xE1tis: voc\xEA est\xE1 abrindo m\xE3o da produ\xE7\xE3o das empresas e das expans\xF5es que ainda faltavam a elas em troca de uma quantia de uma vez agora, de uma sede que arrecada sem operar e de um d\xEDzimo para quem construir ao lado dela. Todo EP que aquelas empresas j\xE1 pontuaram est\xE1 embolsado e continua embolsado. \xC9 mais forte no Ano 3 e costuma ser um erro no Ano 1."}]},{id:"scoring",title:"Vit\xF3ria",blocks:[{p:"Pontue de forma constante em vez de perseguir um \xFAnico grande lance. Amplitude paga cedo; tamanho paga tarde."},{table:{head:["Fonte","EP"],rows:[["Entrar em um setor pela primeira vez","+3 cada, uma vez por setor por partida, creditados imediatamente"],["Cada empresa, quando \xE9 constru\xEDda - e de novo quando \xE9 expandida","+2 por n\xEDvel"],["Ficha de Megacorpora\xE7\xE3o","+8 a +22, conforme impresso"],["Sede de Megacorpora\xE7\xE3o, a cada trimestre em que estiver de p\xE9","+ o pre\xE7o do seu setor / o patamar da sua ficha, arredondado para baixo"],["Sede de Megacorpora\xE7\xE3o, a cada trimestre","+o pre\xE7o do seu setor dividido pelo patamar da ficha; e ela paga 1 EP a cada empresa rival ao seu lado, que aquele dono embolsa"],["O Magnata Imobili\xE1rio - mais lotes possu\xEDdos, a cada fim de ano","+5 s\xF3 ao l\xEDder isolado, +10 com 4+ jogadores"],["O Onipresente - mais distritos em que voc\xEA est\xE1 presente, a cada fim de ano","+5 s\xF3 ao l\xEDder isolado, +10 com 4+ jogadores"],["Dinheiro em caixa no fim","+1 a cada $50 completos"],["Cada disco de empr\xE9stimo ainda no banco","-5"]]}},{p:"Para O Onipresente, um distrito conta se voc\xEA possui um lote nele ou se uma de suas empresas ativas est\xE1 nele."},{p:"O aluguel do terreno \xE9 simplesmente dinheiro. Ele \xE9 recebido conforme \xE9 gerado e pontua dentro do seu caixa no fim, como qualquer outro d\xF3lar - n\xE3o h\xE1 nada separado para controlar. O que vale saber \xE9 quanto da sua renda ele silenciosamente se torna: um lote com a constru\xE7\xE3o de outra pessoa em cima paga voc\xEA todo trimestre, e com seis jogadores metade dos lotes que um jogador possui carrega a constru\xE7\xE3o de um rival."},{note:"Esse n\xFAmero j\xE1 mudou duas vezes, nas duas por causa de mudan\xE7as nas regras de pre\xE7o. Era $10 at\xE9 a trilha de pre\xE7os entrar; a trilha deixou a economia maior, e pontuar isso na taxa antiga dobrou a linha do dinheiro, de cerca de um ter\xE7o de uma pontua\xE7\xE3o vencedora para cerca de metade, de modo que n\xE3o gastar rendia mais do que construir. $20 corrigiu isso. Aumentar toda base em $2 e fazer cada evento valer um d\xF3lar inteiro provocou a mesma coisa de novo, em escala maior - a arrecada\xE7\xE3o sobe 83% - e $50 corrige de novo: medida ao longo de 2250 partidas, a pontua\xE7\xE3o vencedora fica a 2% de onde estava, ao passo que deixar a taxa em $20 a teria inflado em 44%. Uma taxa que s\xF3 acompanhasse o dinheiro seria $37; $50 est\xE1 certo porque os bots tamb\xE9m precificam cada decis\xE3o por meio desse n\xFAmero, ent\xE3o uma taxa mais alta tamb\xE9m faz construir valer mais do que guardar. Veja audit_base_plus_two.js. Se as regras de pre\xE7o mudarem de novo, esse n\xFAmero muda junto - s\xE3o um \xFAnico ajuste em dois lugares."},{note:"O aluguel chegou a ter sua pr\xF3pria linha de pontua\xE7\xE3o por um tempo, enquanto o equil\xEDbrio das terras estava sendo investigado. Ele foi reincorporado ao caixa: a separa\xE7\xE3o n\xE3o mudou nenhum total, e pedir que a mesa mantenha uma contagem corrente de aluguel a partida inteira para dividir um n\xFAmero em duas metades que voltam a som\xE1-lo \xE9 burocracia sem decis\xE3o. A vers\xE3o digital ainda mostra o fluxo, onde isso n\xE3o custa nada. Terras mais aluguel somam cerca de 27% de uma pontua\xE7\xE3o vencedora com dois assentos e 14% com seis - veja audit_idle_land.js."},{p:"S\xF3 o l\xEDder isolado pontua um pr\xEAmio de terras, e uma lideran\xE7a compartilhada paga mal. Com dois e tr\xEAs jogadores: 5 EP sozinho, 2 EP para cada um se dois empatarem, 1 EP para cada um se tr\xEAs ou mais empatarem. Com quatro jogadores ou mais, todos os valores dobram - 10 EP sozinho, 4 para cada um num empate duplo, 2 para cada um al\xE9m disso. O segundo lugar n\xE3o recebe nada em nenhuma contagem."},{note:"Os dois pr\xEAmios pagam os mesmos ~29 EP ao longo de uma partida, estejam duas pessoas ou seis disputando, ent\xE3o uma taxa calibrada para uma mesa pequena \xE9 erro de arredondamento numa mesa grande - as terras s\xE3o 17% de uma pontua\xE7\xE3o vencedora com dois assentos e 3.5% com seis. A 5 EP, o jogador que det\xE9m mais terreno vence ABAIXO do que um assento indiferente levaria, em qualquer contagem: perseguir terras era uma armadilha. Dobrar o pr\xEAmio a partir de quatro jogadores recoloca essa disputa no n\xEDvel do acaso ou acima dele sem achatar o jogo - as mudan\xE7as de lideran\xE7a aumentam em toda mesa e as partidas lideradas do come\xE7o ao fim diminuem. A mesma mudan\xE7a com dois e tr\xEAs faz as terras chegarem a 41% e 33% de uma pontua\xE7\xE3o vencedora e o jogo se acomoda de forma mensur\xE1vel, ent\xE3o as mesas pequenas mant\xEAm a taxa antiga. Pagar o vice \xE9 pior do que n\xE3o pagar ningu\xE9m: metade a mais de EP, e o l\xEDder em terras vence com menos frequ\xEAncia."},{note:"Os pr\xEAmios pagavam 10 e 5 e eram divididos entre os empatados, o que significava que quase todo mundo levava alguma coisa e manter terras nunca era de fato uma disputa - eram 21% da pontua\xE7\xE3o de um assento m\xE9dio em troca de pouqu\xEDssima decis\xE3o. Pagar s\xF3 ao l\xEDder, e pagar mal por um empate, derruba isso para cerca de 9% e transforma aquilo numa corrida de novo."},{h:"Quando a partida termina"},{p:"A partida termina no encerramento do Trimestre 12, OU no encerramento do trimestre SEGUINTE a qualquer jogador fundar sua SEGUNDA Megacorpora\xE7\xE3o - o que vier primeiro. A segunda Megacorpora\xE7\xE3o n\xE3o encerra a partida; ela CONVOCA o trimestre final, e todos t\xEAm esse trimestre para responder. Se ela for fundada no Q11 ou depois, a partida simplesmente termina no Q12, como de costume."},{p:"Quem tiver mais EP vence. Se as pontua\xE7\xF5es finais empatarem, vence o jogador que ainda mant\xE9m mais EMPRESAS ATIVAS - sedes n\xE3o contam, porque uma sede parou de operar. Se isso tamb\xE9m estiver igual, vence quem tiver mais dinheiro; e, se ainda houver empate, quem tiver menos discos de empr\xE9stimo no banco."},{note:"A segunda Megacorpora\xE7\xE3o \xE9 um prazo, n\xE3o um atalho. Um jogador capaz de montar duas passou a partida fundindo empresas, e o resto da mesa teria, de outro modo, mais quatro trimestres vendo esse jogador disparar na frente. Na pr\xE1tica, com que frequ\xEAncia isso morde depende inteiramente da mesa: encerra a partida mais cedo em 10% das partidas de dois jogadores, 1% das de tr\xEAs, 8% das de quatro, 21% das de cinco e 36% das de seis. Nas mesas maiores - as que mais t\xEAm motivo para querer uma noite curta - isso faz trabalho de verdade; com tr\xEAs assentos, a partida essencialmente sempre vai at\xE9 os doze trimestres completos. O que ele realmente faz \xE9 p\xF4r um rel\xF3gio na \xFAltima fus\xE3o do l\xEDder."},{note:"Os dois par\xE2metros foram ajustados juntos contra 300 partidas por caso. A 3 EP por n\xEDvel, as empresas eram 32% da pontua\xE7\xE3o de um assento m\xE9dio e todo o resto sumia atr\xE1s delas; a 1 EP, uma expans\xE3o deixava de compensar pagar o custo inicial duas vezes e as empresas expandidas ca\xEDram de 5.1 por partida para 3.1, enquanto o b\xF4nus de entrada de 5 EP inchou para 27% de uma pontua\xE7\xE3o por uma decis\xE3o que mal \xE9 uma decis\xE3o. Dois e tr\xEAs n\xE3o deixam nada acima de um ter\xE7o, e construir continua sendo a maior coisa isolada. Remedido ao longo de 150 partidas por tamanho de mesa com as regras como elas est\xE3o - o pr\xEAmio de terras escalonado por mesa e o d\xEDzimo da Megacorpora\xE7\xE3o - em todos os assentos: empresas e expans\xF5es 38-43%, entrar em um setor 13-14%, pr\xEAmios de terras 20% com dois assentos, 14% com tr\xEAs, 18% com quatro, 14% com cinco e 12% com seis, formar uma Megacorpora\xE7\xE3o 7-14%, o EP de marca 5-12%, o d\xEDzimo cerca de 1-2% para cada lado, dinheiro em caixa 11-14% e empr\xE9stimos n\xE3o pagos cerca de -1%. As terras n\xE3o desabam mais com o n\xFAmero de jogadores: eram 6% com seis assentos antes de o pr\xEAmio escalonar. Veja audit_state_of_play.js."},{note:"Dois desses n\xFAmeros merecem a aten\xE7\xE3o de um designer. O DINHEIRO EM CAIXA \xC9 CERCA DE UM TER\xC7O DE UMA PONTUA\xC7\xC3O VENCEDORA em qualquer tamanho de mesa - muito peso para uma regra que soa como arredondar as sobras, e isso significa que um jogador que simplesmente n\xE3o gasta pontua tanto quanto um que constr\xF3i. E OS PR\xCAMIOS DE TERRAS ENCOLHEM CONFORME A MESA CRESCE, de 20% dos pontos do vencedor com dois assentos para 5% com seis quando o pr\xEAmio \xE9 fixo, porque um pr\xEAmio fixo \xE9 dividido entre mais pretendentes enquanto toda outra fonte escala com o quanto voc\xEA faz - e \xE9 por isso que o pr\xEAmio agora dobra a partir de quatro jogadores. O dinheiro \xE9 a alavanca que resta, caso o equil\xEDbrio volte a ser revisto."}]},{id:"personas",title:"Personas",blocks:[{p:"Personas s\xE3o poderes assim\xE9tricos, um ligado a cada setor. Elas s\xE3o distribu\xEDdas por padr\xE3o - deixe-as de fora numa primeira partida, se preferir - e s\xF3 se distribuem tantas quantos forem os jogadores, ent\xE3o numa mesa pequena algumas ficam de fora. A persona de cada um \xE9 p\xFAblica desde o in\xEDcio, ent\xE3o voc\xEA pode pesar a sua pr\xF3pria especialidade e a de todos os outros durante o draft."},{table:{head:["Persona","Poder"],rows:[["Arquiteto de Sistemas (TE)","Suas empresas de Tecnologia podem expandir verticalmente, empilhando em um \xFAnico lote em vez de precisar de um vizinho livre - ou se espalhar como a Tecnologia costuma fazer. Voc\xEA escolhe a cada expans\xE3o."],["Diretor de Sa\xFAde P\xFAblica (HC)","Suas empresas de Sa\xFAde podem atender qualquer coluna de uma linha de Sa\xFAde, seja qual for o n\xEDvel delas - mas uma unidade vendida acima do n\xEDvel da sua empresa paga $1 a menos que o pre\xE7o."],["Fornecedor White-Label (MA)","Quando sua Manufatura faz venda cruzada na linha de outro setor, ela pode ser paga pelo pre\xE7o daquele setor em vez do pr\xF3prio - o que for maior."],["Incorporador de Resorts (HO)","Suas empresas de Hotelaria podem expandir horizontalmente, espalhando-se por lotes para que mais empresas e centros log\xEDsticos fiquem adjacentes a elas - ou empilhar como a Hotelaria costuma fazer. Voc\xEA escolhe a cada expans\xE3o."],["Especialista em Cadeia de Suprimentos (RE)","No in\xEDcio da Produ\xE7\xE3o, voc\xEA pode elevar em um passo um setor que voc\xEA N\xC3O opera; seu Varejo ent\xE3o alcan\xE7a um distrito extra neste trimestre. Voc\xEA tamb\xE9m pode recusar."],["Concession\xE1rio (UT)","No in\xEDcio da Produ\xE7\xE3o voc\xEA pode ligar sua concess\xE3o: sua produ\xE7\xE3o de Servi\xE7os P\xFAblicos ent\xE3o vende por $1 acima do pre\xE7o atual neste trimestre. A cada trimestre em que voc\xEA vender com esse \xE1gio, o pre\xE7o de Servi\xE7os P\xFAblicos cai um passo no fim do trimestre."]]}},{note:"Cada persona \xE9 uma inclina\xE7\xE3o, n\xE3o uma jaula. Todas apontam deliberadamente para fazer mais de um setor, e o b\xF4nus de entrada aponta deliberadamente para o outro lado, ent\xE3o uma persona muda a sua melhor linha de jogo sem reduzi-la a uma s\xF3."}]},{id:"variants",title:"Variantes de regras (opcional)",blocks:[{p:"Todas elas v\xEAm desligadas por padr\xE3o, e uma mesa que n\xE3o mexer em nenhuma joga exatamente as regras deste livro. Podem ser combinadas livremente."},{p:"Todas soam como jogar do jeito antigo, porque \xE9 isso que elas s\xE3o. Cinco regras que eram opcionais na v12 viraram padr\xE3o na v13, e o que continua altern\xE1vel \xE9 o jogo como ele era antes."},{table:{head:["Variante","O que muda"],rows:[["Pontuar no fim de ano","Uma empresa espera o pr\xF3ximo fim de ano para receber seus EP, em vez de pontuar no momento em que \xE9 constru\xEDda ou expandida. Ela continua pontuando uma vez por constru\xE7\xE3o ou expans\xE3o."],["N\xEDveis pontuam pesado","Um n\xEDvel de empresa vale 3 EP em vez de 2. Construir alto vira a maior coisa isolada do placar, ao custo de empurrar terras, dinheiro e os b\xF4nus de entrada para segundo plano."],["Baralhos ordenados","Cada baralho de setor vai do n\xEDvel 1 no topo at\xE9 o n\xEDvel 3 no fundo, em vez de ser embaralhado por inteiro. Nenhum n\xEDvel 3 pode ser draftado, e o in\xEDcio de partida n\xE3o guarda surpresas."],["Centros log\xEDsticos na estrada","Um Centro Log\xEDstico fica sobre uma divisa e une os dois distritos de cada lado, em vez de ficar num lote e alcan\xE7ar apenas o seu pr\xF3prio. Nenhum lote \xE9 consumido, e todo centro log\xEDstico vale dois distritos em vez de um."],["Pr\xEAmios de terras s\xF3 no fim","O Magnata Imobili\xE1rio e O Onipresente s\xE3o pagos uma \xFAnica vez, depois do Trimestre 12, em vez de a cada fim de ano. As terras viram uma corrida de fim de partida, em vez de algo para manter a partida inteira."]]}},{p:"Combinem quais delas est\xE3o ligadas antes do draft. V\xE1rias mudam quanto vale um Projeto, ent\xE3o escolher no meio do caminho n\xE3o \xE9 um ato neutro.",only:"table"},{p:"As que estiverem ligadas s\xE3o mostradas na sala de espera antes de a partida come\xE7ar e ficam registradas junto com a partida conclu\xEDda, ent\xE3o uma mesa com variantes nunca \xE9 confundida com uma padr\xE3o nos registros.",only:"digital"},{note:"Elas continuam altern\xE1veis para que as duas vers\xF5es possam ser jogadas lado a lado, n\xE3o porque as antigas estejam equilibradas em rela\xE7\xE3o \xE0s novas. Ligar as cinco joga a v12 quase exatamente."},{note:"Centros log\xEDsticos em lotes s\xE3o uma restri\xE7\xE3o de verdade: um quarto dos lotes do tabuleiro n\xE3o tem nenhum vizinho ortogonal, ent\xE3o um centro mal colocado n\xE3o conecta ningu\xE9m. \xC9 a regra funcionando como planejado - \xE9 por isso que o seletor de centros diz quantos lotes um ponto conectaria antes de voc\xEA se comprometer com ele - mas \xE9 tamb\xE9m a regra com maior chance de precisar de uma nova olhada depois de algumas mesas."}]},{id:"online",title:"Jogando online",only:"digital",blocks:[{p:"Crie uma sala e compartilhe o c\xF3digo de seis caracteres. Qualquer pessoa que o digitar entra na sua mesa."},{ul:["2 a 6 assentos em qualquer mistura de pessoas e bots. Os bots preenchem qualquer assento que voc\xEA n\xE3o queira esperar.","Se a mesa estiver cheia ou a partida j\xE1 tiver come\xE7ado, quem chega depois entra como espectador: v\xEA o tabuleiro inteiro e pode usar o chat e falar, mas n\xE3o pode agir.","O chat de texto e o chat de voz s\xE3o integrados. A voz roda ponto a ponto - o servidor s\xF3 faz a apresenta\xE7\xE3o.","Atualizar a p\xE1gina ou perder a conex\xE3o n\xE3o faz voc\xEA perder o assento. Volte ao mesmo endere\xE7o e voc\xEA \xE9 recolocado direto no jogo.","Se algu\xE9m sair de vez, o anfitri\xE3o pode entregar o assento dessa pessoa a um bot para que a mesa n\xE3o fique parada."]},{p:"O servidor \xE9 a autoridade: ele roda o mesmo motor de regras e rejeita qualquer coisa que n\xE3o seja a sua jogada, ent\xE3o ningu\xE9m consegue agir fora de turno."}]},{id:"quickref",title:"Refer\xEAncia r\xE1pida",blocks:[{table:{head:["",""],rows:[["Dura\xE7\xE3o da partida","12 trimestres (3 anos de 4), ou at\xE9 algu\xE9m fundar uma 2\xAA Megacorpora\xE7\xE3o"],["Jogadores","2 a 6"],["Trabalhadores","2 para cada um, ou 3 para cada um em uma partida de dois jogadores"],["Discos","12, cobrindo lotes em sua posse + empresas ativas + empr\xE9stimos n\xE3o quitados"],["Espa\xE7os de empresa","5, contando a sede da Megacorpora\xE7\xE3o"],["Limite de m\xE3o","5 Projetos"],["Empr\xE9stimo","+$20 e um disco; recompre por $30 / $35 / $40 nos fins de ano; -5 EP se n\xE3o for quitado"],["Vender um Projeto","$4 / $8 / $12 conforme o n\xEDvel; $2 / $4 / $6 em venda for\xE7ada"],["Vender uma empresa","metade do custo inicial, ou o custo inicial cheio se ela estiver expandida; pela metade de novo em venda for\xE7ada"],["Valor do lote","pre\xE7o da via (1-6) + $1 por vizinho ocupado + $1 se encostar em um Centro Log\xEDstico"],["Expans\xE3o","pague o custo inicial de novo; produ\xE7\xE3o e OPEX dobram; n\xEDvel +1"],["Aluguel","$2 por n\xEDvel da empresa, para os donos dos lotes que ela ocupa"],["Produ\xE7\xE3o n\xE3o vendida","$1 por unidade"],["Fundo do setor","dividido igualmente entre as empresas ativas daquele setor; a sobra fica para o trimestre seguinte"],["Reforma","a carta precisa ter o mesmo n\xEDvel da estrutura; do n\xEDvel 2 em diante, tamb\xE9m o mesmo tipo de expans\xE3o"],["Empate final","mais empresas ativas, depois mais dinheiro, depois menos discos de empr\xE9stimo no banco"],["Linhas 3-4 da demanda","fechadas at\xE9 o Trimestre 5"],["Grade de demanda","zerada no fim do Trimestre 8"],["Pontua\xE7\xE3o de empresas","2 EP por n\xEDvel, no instante em que ela \xE9 constru\xEDda - e de novo quando \xE9 expandida"],["Estreia em um setor","3 EP na primeira vez que voc\xEA constr\xF3i em cada setor, creditados de imediato"],["Pr\xEAmios de terras","5 EP para quem liderar isoladamente em lotes, e em distritos, a cada fim de ano - 10 com 4+ jogadores"],["Centro Log\xEDstico","um por trimestre, em um lote vazio sem dono; alcan\xE7a o pr\xF3prio distrito; conecta-se ortogonalmente"]]}}]},{id:"glossary",title:"As palavras do tabuleiro",blocks:[{p:"Quase todo termo deste jogo \xE9 um termo real, usado do jeito que uma empresa de verdade o usa. Isso n\xE3o \xE9 enfeite. Quem aprende aqui o que significa OPEX sabe o que a palavra significa em um balan\xE7o, e quem j\xE1 sabe consegue ler metade das regras no vocabul\xE1rio antes de algu\xE9m explicar."},{h:"As quatro trilhas de a\xE7\xE3o"},{table:{head:["Termo","Significado, e uso em jogo"],rows:[["M&A","Mergers and Acquisitions, ou fus\xF5es e aquisi\xE7\xF5es - a \xE1rea que compra, constr\xF3i e combina empresas. No jogo: onde voc\xEA funda uma empresa, compra terreno ou retoma do banco um pr\xE9dio em dificuldade."],["P&D","Pesquisa e Desenvolvimento - gastar agora para ter capacidade depois. No jogo: compre cartas de Projeto, ou expanda uma empresa que voc\xEA j\xE1 tem. Nada nesta trilha paga neste trimestre."],["Captar Recursos","Procurar credores ou investidores em busca de dinheiro, a troco de juros ou de uma fatia da empresa. No jogo: pegue um empr\xE9stimo de $20 contra um disco, ou venda um ativo para fazer caixa."],["Reuni\xE3o do Conselho","Onde quem decide s\xE3o os donos, n\xE3o os gestores - reestrutura\xE7\xF5es, aberturas de capital, quem preside a mesa. No jogo: abra capital para formar uma Megacorpora\xE7\xE3o, ou reposicione-se como primeiro na ordem de turno. Seus trabalhadores v\xE3o para c\xE1 juntos."]]}},{h:"Dinheiro que entra e dinheiro que sai"},{table:{head:["Termo","Significado, e uso em jogo"],rows:[["OPEX","Operating expenditure, a despesa operacional - o custo recorrente de manter o que voc\xEA j\xE1 tem. Sal\xE1rios, energia, estoque: as coisas que voltam a ser cobradas no m\xEAs seguinte, tendo voc\xEA vendido algo ou n\xE3o. No jogo: o custo de opera\xE7\xE3o impresso em cada Projeto, cobrado todo trimestre - $2 por n\xEDvel v\xE3o como aluguel do terreno ao propriet\xE1rio do lote, e o resto \xE9 a conta de fornecedores, paga aos setores que a carta lista."],["Custo inicial","Capital expenditure, ou CAPEX - o que custa erguer a coisa em primeiro lugar, pago uma \xFAnica vez. No jogo: o pre\xE7o impresso no Projeto, pago de novo por inteiro para expandir."],["Aluguel do terreno","O que um inquilino paga ao dono da terra por ocup\xE1-la, venda ele muito ou nada. No jogo: $2 por n\xEDvel da empresa, para quem for dono de cada lote que ela ocupa. Nada em terreno que seja seu."],["Liquidez","Ter dinheiro \xE0 m\xE3o, em oposi\xE7\xE3o \xE0 riqueza presa em coisas que voc\xEA teria de vender. No jogo: a raz\xE3o pela qual um tabuleiro cheio de pr\xE9dios ainda pode fazer voc\xEA perder a partida - as contas se pagam em dinheiro, n\xE3o em ativos."],["Solv\xEAncia","Conseguir pagar as d\xEDvidas no vencimento; n\xE3o conseguir \xE9 a insolv\xEAncia. No jogo: quando voc\xEA n\xE3o cobre a conta de uma empresa, o banco vende seus ativos por voc\xEA pela metade do pre\xE7o e essa empresa vai para o tabuleiro em dificuldade."],["Liquida\xE7\xE3o","Vender os ativos, em geral sob press\xE3o e em geral abaixo do que valem. No jogo: a pr\xF3pria venda for\xE7ada - tudo sai pela metade do que uma venda planejada renderia."]]}},{h:"As empresas e o que acontece com elas"},{table:{head:["Termo","Significado, e uso em jogo"],rows:[["Projeto","Uma especifica\xE7\xE3o t\xE9cnica - a coisa que voc\xEA de fato construiria. No jogo: uma carta, com seu setor, n\xEDvel, custo inicial, OPEX, fornecedores e produ\xE7\xE3o."],["Portf\xF3lio","Tudo o que um dono possui, visto em conjunto e n\xE3o um item de cada vez. No jogo: as empresas que voc\xEA construiu. Cinco espa\xE7os, seis se voc\xEA ficar com a ficha de IPO."],["Ativo em Dificuldade","Uma empresa em apuros, vendida barato por um credor que quer sair mais do que quer um pre\xE7o justo. No jogo: uma empresa que o banco segura depois de uma insolv\xEAncia ou de uma fus\xE3o. Qualquer um pode retom\xE1-la pelo que o banco pagou."],["IPO","Initial Public Offering, a oferta p\xFAblica inicial - a primeira venda de a\xE7\xF5es de uma empresa ao p\xFAblico, um evento \xFAnico que muda o que a empresa \xE9. No jogo: abrir capital antes de todo mundo garante a ficha de IPO e um sexto espa\xE7o de empresa. S\xF3 o primeiro jogador a fazer isso ganha uma."],["Megacorpora\xE7\xE3o","Um conglomerado: v\xE1rias empresas fundidas sob uma holding. No jogo: realize a fus\xE3o na combina\xE7\xE3o exata de n\xEDveis de empresa que a ficha pede. Uma delas vira a sede; as demais ficam em dificuldade."],["Sede (HQ)","A matriz - ela dirige e det\xE9m, n\xE3o fabrica o produto. No jogo: a empresa fundida que deixa de operar, mas segue embolsando EP a partir do pre\xE7o do seu setor a cada trimestre."],["Marca","O nome em si como ativo, que rende independentemente do que as f\xE1bricas fizerem. No jogo: o que a sede de uma Megacorpora\xE7\xE3o embolsa a cada trimestre - o pre\xE7o do seu setor dividido pelo patamar da ficha."]]}},{h:"O mercado"},{table:{head:["Termo","Significado, e uso em jogo"],rows:[["Cadeia de suprimentos","A fila de empresas em que cada uma compra da anterior, at\xE9 chegar ao cliente. No jogo: vem impressa em todo Projeto. Seu OPEX \xE9 o seu lugar na cadeia de outra pessoa."],["B2B","Business to business - vender para outras empresas, e n\xE3o para o p\xFAblico. No jogo: a etapa de Receita em que os fundos dos setores s\xE3o repartidos. Esse dinheiro veio das contas dos outros jogadores, n\xE3o dos distritos."],["Fundo do setor","Tudo o que um setor gasta, e que as empresas dele dividem entre si. No jogo: toda empresa de um setor recebe uma parte igual, seja qual for o seu tamanho. Fornecer a um setor em que ningu\xE9m construiu \xE9 muito lucrativo."],["Demanda","O que o mercado vai de fato comprar, a certo pre\xE7o, agora. No jogo: os quadrados coloridos de cada distrito. Quem chega primeiro leva."],["Integra\xE7\xE3o vertical","Crescer passando a ser dono de mais trechos da sua pr\xF3pria cadeia de suprimentos - para cima, em um s\xF3 lugar. No jogo: \xE9 assim que Varejo, Hotelaria e Sa\xFAde se expandem, empilhando o novo n\xEDvel em um lote que a empresa j\xE1 ocupa."],["Integra\xE7\xE3o horizontal","Crescer tomando mais terreno no mesmo est\xE1gio - para os lados, em v\xE1rios lugares. No jogo: \xE9 assim que Servi\xE7os P\xFAblicos, Manufatura e Tecnologia se expandem; cada novo n\xEDvel exige um lote seu vazio ao lado do pr\xE9dio."],["Centro Log\xEDstico","Um centro de distribui\xE7\xE3o - movimenta mercadorias em vez de fabric\xE1-las. No jogo: abre em um lote vazio sem dono a cada trimestre e amplia o alcance das empresas ao seu lado."]]}},{h:"Tempo e pontua\xE7\xE3o"},{table:{head:["Termo","Significado, e uso em jogo"],rows:[["Ano fiscal","Os doze meses sobre os quais uma empresa presta contas, que n\xE3o precisam coincidir com o calend\xE1rio. No jogo: s\xE3o tr\xEAs, de quatro trimestres cada. As contas s\xE3o acertadas no fim de cada ano."],["Trimestre","Um per\xEDodo de tr\xEAs meses de presta\xE7\xE3o de contas; empresas de capital aberto divulgam resultados quatro vezes por ano. No jogo: uma rodada - planejar, agir, produzir, vender, encerrar."],["EP","N\xE3o \xE9 um termo real - \xE9 a pontua\xE7\xE3o do pr\xF3prio jogo. Pontos de Empreendedorismo: pr\xE9dios, estreias em setores, Megacorpora\xE7\xF5es, terras e o dinheiro que sobrou, tudo se converte neles."]]}},{note:"O jarg\xE3o \xE9 estrutural, n\xE3o \xE9 tempero. Playtesters que nunca tinham jogado um jogo econ\xF4mico pesado sabiam mais ou menos o que eram P&D e uma cadeia de suprimentos, e esse conhecimento fez trabalho de verdade no ensino - eles adivinharam o que as trilhas faziam antes de as trilhas serem explicadas. Vale nomear o \xFAnico ponto em que o jogo se afasta do uso real: aqui OPEX \xE9 o custo de opera\xE7\xE3o impresso de uma empresa, dividido na mesa entre conta de fornecedores e aluguel do terreno, e o jogo nunca cobra sal\xE1rios ou estoque al\xE9m disso. Quem \xE9 da \xE1rea financeira vai ler a palavra num sentido mais amplo do que o jogo quer dizer. A troca foi deliberada - separar os dois pagamentos \xE9 o que permitiu \xE0 mesa parar de fazer contas no meio do trimestre - mas \xE9 o termo que mais tende a exigir uma segunda frase na hora de ensinar."},{note:"Integra\xE7\xE3o vertical e horizontal s\xE3o os verbetes que mais merecem uma segunda leitura. Elas s\xE3o a distin\xE7\xE3o de verdade - Carnegie comprando as pr\xF3prias minas de carv\xE3o contra uma rede abrindo mais lojas - e s\xE3o tamb\xE9m a maior quest\xE3o de equil\xEDbrio ainda em aberto do jogo. Uma empresa horizontal chega ao n\xEDvel 4 em 3 por cento das partidas, e uma vertical, em 22, porque uma expans\xE3o horizontal exige um terreno seu vazio ao lado do pr\xE9dio e o tabuleiro acaba ficando sem. O vocabul\xE1rio \xE9 honesto; os n\xFAmeros por tr\xE1s dele ainda n\xE3o est\xE3o parelhos."},{note:"Duas colunas, n\xE3o tr\xEAs. O formato \xF3bvio \xE9 termo / significado real / significado no jogo, e funciona bem no papel - mas a terceira coluna \xE9 a que importa na mesa, e era justamente ela que ficava cortada na lateral do celular. Juntar as duas metades em uma s\xF3 c\xE9lula preserva o par e sobrevive a uma tela de 390px."}]},{id:"blueprints",title:"Anexo: os sessenta Projetos",blocks:[{p:"Todas as cartas do jogo, por setor. CUSTO INICIAL \xE9 o que custa construir, e de novo para expandir. OPEX \xE9 o custo de opera\xE7\xE3o impresso na carta: $2 por n\xEDvel v\xE3o como aluguel do terreno para quem for dono do terreno, e o resto \xE9 a conta de fornecedores, dividida entre os fornecedores na propor\xE7\xE3o das partes indicadas abaixo. PRODU\xC7\xC3O \xE9 quantas unidades ela produz por trimestre, e dobra na expans\xE3o junto com o OPEX."},{note:"Este anexo \xE9 gerado a partir dos pr\xF3prios dados das cartas e conferido contra eles c\xE9lula a c\xE9lula em check_rulebook.mjs, de modo que nenhuma carta pode ser rebalanceada sem que o livro acompanhe. \xC9 a \xFAnica parte do livro que ningu\xE9m deveria jamais editar \xE0 m\xE3o."},{h:"Servi\xE7os P\xFAblicos (UT) - pre\xE7o base $4, expande horizontalmente"},{table:{head:["Projeto UT","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["Solar Field I","1","15 / 4 / 4","HO 4"],["Hydro-Farm Initiative I","1","15 / 4 / 4","HO 4"],["Wind Farm I","1","15 / 4 / 4","TE 4"],["Biomass Plant I","1","15 / 4 / 4","TE 4"],["Tidal Generator I","1","15 / 4 / 4","HC 4"],["Fusion Conduit Hub II","2","20 / 7 / 8","HO 4, TE 3"],["Smart Grid Node II","2","20 / 7 / 8","HO 4, HC 3"],["Oceanic Turbine II","2","20 / 7 / 8","TE 4, HC 3"],["Geothermal Supernode III","3","30 / 10 / 16","HO 4, TE 3, HC 3"],["Antimatter Reactor III","3","30 / 10 / 16","HO 4, TE 3, HC 3"]]}},{h:"Varejo (RE) - pre\xE7o base $4, expande verticalmente"},{table:{head:["Projeto RE","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["Corner Store I","1","10 / 5 / 4","TE 5"],["Pop-Up Kiosk I","1","10 / 5 / 4","TE 5"],["Local Market I","1","10 / 5 / 4","HO 5"],["Strip Mall I","1","10 / 5 / 4","HO 5"],["Vending Network I","1","10 / 5 / 4","MA 5"],["Supermarket II","2","15 / 9 / 8","TE 5, HO 4"],["Department Store II","2","15 / 9 / 8","TE 5, MA 4"],["Outlet Center II","2","15 / 9 / 8","HO 5, MA 4"],["Mega-Mall III","3","25 / 14 / 16","TE 6, HO 4, MA 4"],["Omni-Channel Hub III","3","25 / 14 / 16","TE 6, HO 4, MA 4"]]}},{h:"Hotelaria (HO) - pre\xE7o base $5, expande verticalmente"},{table:{head:["Projeto HO","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["Motel I","1","10 / 6 / 3","MA 6"],["Bed & Breakfast I","1","10 / 6 / 3","MA 6"],["Transit Hostel I","1","10 / 6 / 3","HC 6"],["Roadside Inn I","1","10 / 6 / 3","HC 6"],["Capsule Hotel I","1","10 / 6 / 3","RE 6"],["Business Hotel II","2","15 / 10 / 6","MA 6, HC 4"],["Resort Lodge II","2","15 / 10 / 6","MA 6, RE 4"],["Boutique Hotel II","2","15 / 10 / 6","HC 6, RE 4"],["Luxury Casino III","3","25 / 16 / 12","MA 6, HC 5, RE 5"],["Orbit Resort III","3","25 / 16 / 12","MA 6, HC 5, RE 5"]]}},{h:"Manufatura (MA) - pre\xE7o base $5, expande horizontalmente"},{table:{head:["Projeto MA","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["Assembly Workshop I","1","20 / 4 / 3","HC 4"],["Parts Fabricator I","1","20 / 4 / 3","HC 4"],["Textile Mill I","1","20 / 4 / 3","RE 4"],["Canning Facility I","1","20 / 4 / 3","RE 4"],["Injection Molder I","1","20 / 4 / 3","UT 4"],["Auto Plant II","2","35 / 7 / 6","HC 4, RE 3"],["Microchip Foundry II","2","35 / 7 / 6","HC 4, UT 3"],["Chemical Plant II","2","35 / 7 / 6","RE 4, UT 3"],["Heavy Robotics III","3","60 / 10 / 12","HC 4, RE 3, UT 3"],["Orbital Shipyard III","3","60 / 10 / 12","HC 4, RE 3, UT 3"]]}},{h:"Sa\xFAde (HC) - pre\xE7o base $6, expande verticalmente"},{table:{head:["Projeto HC","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["Urgent Care Clinic I","1","20 / 5 / 2","RE 5"],["Pharmacy I","1","20 / 5 / 2","RE 5"],["Dental Office I","1","20 / 5 / 2","UT 5"],["Wellness Center I","1","20 / 5 / 2","UT 5"],["Physical Therapy I","1","20 / 5 / 2","TE 5"],["General Hospital II","2","35 / 9 / 4","RE 5, UT 4"],["Trauma Center II","2","35 / 9 / 4","RE 5, TE 4"],["Specialized Clinic II","2","35 / 9 / 4","UT 5, TE 4"],["Biotech Campus III","3","60 / 14 / 8","RE 6, UT 4, TE 4"],["Cybernetics Inst. III","3","60 / 14 / 8","RE 6, UT 4, TE 4"]]}},{h:"Tecnologia (TE) - pre\xE7o base $6, expande horizontalmente"},{table:{head:["Projeto TE","N\xEDv","Custo inicial / OPEX / Produ\xE7\xE3o","Fornecedores (parte da conta)"],rows:[["App Startup I","1","15 / 6 / 2","UT 6"],["Data Center I","1","15 / 6 / 2","UT 6"],["Server Farm I","1","15 / 6 / 2","MA 6"],["IT Support Firm I","1","15 / 6 / 2","MA 6"],["Cloud Provider I","1","15 / 6 / 2","HO 6"],["Software Campus II","2","25 / 10 / 4","UT 6, MA 4"],["Network Hub II","2","25 / 10 / 4","UT 6, HO 4"],["Telecom Provider II","2","25 / 10 / 4","MA 6, HO 4"],["Sentient AI Cluster III","3","40 / 16 / 8","UT 6, MA 5, HO 5"],["Quantum Computing III","3","40 / 16 / 8","UT 6, MA 5, HO 5"]]}}]}];var Ol=pe(Ja());var hv={" A plot beside the building takes a new wing, which can sell into that plot's district; a plot under it takes a new storey, and rent for every storey goes to that plot's owner.":" Um lote ao lado do pr\xE9dio recebe uma ala nova, que pode vender no distrito daquele lote; um lote embaixo dele recebe um andar novo, e o aluguel de cada andar vai para o dono daquele lote."," Plots must share an edge \u2014 corners do not count.":" Os lotes precisam compartilhar uma borda \u2014 cantos n\xE3o contam.","18 supply lines in all: no dead ends, and no safe corner":"18 linhas de fornecimento no total: nenhum beco sem sa\xEDda, nenhum canto seguro","2 EP per company level, banked the moment you build or upgrade it":"2 EP por n\xEDvel de empresa, embolsados no instante em que voc\xEA a constr\xF3i ou expande","3 EP the first time you build in each industry \u2014 paid immediately":"3 EP na primeira vez que voc\xEA constr\xF3i em cada setor \u2014 pagos na hora","3 years of 4 quarters \u2014 12 rounds in total":"3 anos de 4 trimestres \u2014 12 rodadas no total","5 EP for most plots and 5 for most districts at every year end \u2014 10 each from 4 players up; a tie pays 2 (4) each":"5 EP por mais lotes e 5 por mais distritos a cada fim de ano \u2014 10 cada um a partir de 4 jogadores; empate paga 2 (4) cada","A Logistic Hub straddles a border and joins the two districts either side, instead of standing on a plot and reaching only its own.":"Um Centro Log\xEDstico fica sobre uma divisa e une os dois distritos de cada lado, em vez de ficar num lote e alcan\xE7ar apenas o seu pr\xF3prio.","A Megacorp is worth 8\u201322 EP, but eats companies and locks a slot":"Uma Megacorpora\xE7\xE3o vale 8\u201322 EP, mas consome empresas e trava um espa\xE7o","A company level is worth 3 EP instead of 2, which puts far more of the game's weight on how tall you build and pushes land, cash and the entry bonuses into the background.":"Um n\xEDvel de empresa vale 3 EP em vez de 2, o que joga muito mais peso do jogo sobre a altura do que voc\xEA constr\xF3i e empurra terreno, dinheiro e os b\xF4nus de entrada para o segundo plano.","A company reaches its own district, plus whatever its ability grants":"Uma empresa alcan\xE7a o pr\xF3prio distrito, mais o que a habilidade dela conceder","A company waits for the next year end to take its EP, instead of scoring the moment it is built or upgraded.":"Uma empresa espera o pr\xF3ximo fim de ano para receber seus EP, em vez de pontuar no momento em que \xE9 constru\xEDda ou expandida.","A company's level decides how much room it needs, and half the industries need it sideways. This is the rule that decides how much land you have to buy.":"O n\xEDvel de uma empresa define de quanto espa\xE7o ela precisa, e metade dos setores precisa dele na horizontal. \xC9 esta a regra que define quanto terreno voc\xEA precisa comprar.","A crowded industry can fall to $2, still twice what recycling pays":"Um setor lotado pode cair a $2, ainda o dobro do que a reciclagem paga","A neglected one can climb to $12 per unit":"Um negligenciado pode subir a $12 por unidade","A quarter, step by step":"Um trimestre, passo a passo","A rule that misfired, or a bug.":"Uma regra que falhou, ou um bug.","A table seats six. All four Megacorp tiers are in from four players. The fifth and sixth seats open a fifth and sixth slot on each of the three working tracks, and draw three, then four, tiles from each tier instead of two.":"Uma mesa comporta seis. Todos os quatro patamares de Megacorpora\xE7\xE3o entram a partir de quatro jogadores. O quinto e o sexto assentos abrem um quinto e um sexto espa\xE7o em cada uma das tr\xEAs trilhas de trabalho, e sacam tr\xEAs, depois quatro, fichas de cada patamar em vez de duas.","ACTION \u2014 tracks resolve and you act":"A\xC7\xC3O \u2014 as trilhas resolvem e voc\xEA age","AFTER BILLS":"AP\xD3S AS CONTAS",Academic:"Acad\xEAmico","Active companies":"Empresas ativas","Add something to tell yourselves apart \u2014 or carry on, if it really is you.":"Acrescente algo para diferenciar voc\xEAs dois \u2014 ou siga assim, se for voc\xEA mesmo.","Amber-bordered cells are cross-sell slots \u2014 Manufacturing may fill another industry's demand within its own footprint.":"C\xE9lulas com borda \xE2mbar s\xE3o espa\xE7os de venda cruzada \u2014 Manufatura pode atender a demanda de outro setor dentro da pr\xF3pria \xE1rea ocupada.","An idea":"Uma ideia","Anything you cannot sell recycles for just $1 a unit":"Tudo o que voc\xEA n\xE3o vender \xE9 reciclado por apenas $1 a unidade","At the start of Production you may switch your concession on: your Utilities production then sells for $1 above the current price this quarter. Every quarter you sell at that premium, the Utilities price falls one step at the end of the quarter.":"No in\xEDcio da Produ\xE7\xE3o voc\xEA pode ligar sua concess\xE3o: sua produ\xE7\xE3o de Servi\xE7os P\xFAblicos ent\xE3o vende por $1 acima do pre\xE7o atual neste trimestre. A cada trimestre em que voc\xEA vender com esse \xE1gio, o pre\xE7o de Servi\xE7os P\xFAblicos cai um passo no fim do trimestre.","At the start of Production, you may raise one industry you do NOT operate by one step; your Retail then reaches one extra district this qu

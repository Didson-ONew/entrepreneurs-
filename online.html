<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#0e1014"/><title>Entrepreneurs &mdash; Online</title><style>/* ===========================================================
   Entrepreneurs — standalone stylesheet
   Implements exactly the Tailwind utility classes used by the
   game, so the app runs fully offline with no CDN dependency.
   =========================================================== */

/* --- preflight (the parts Tailwind's CDN normally supplies) --- */
*, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; line-height: 1.5; }
body {
  line-height: inherit;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  background-color: #0e1014;
  color: #e5e7eb;
}
button { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit;
         color: inherit; background-color: transparent; background-image: none; cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3, h4 { font-size: inherit; font-weight: inherit; }
:root { --gap: 0px; }

/* --- display --- */
.block          { display: block; }
.inline-block   { display: inline-block; }
.flex           { display: flex; }
.inline-flex    { display: inline-flex; }
.grid           { display: grid; }

/* --- position --- */
.fixed          { position: fixed; }
.z-50           { z-index: 50; }

/* --- flex / grid --- */
.flex-1         { flex: 1 1 0%; }
.flex-col       { flex-direction: column; }
.flex-wrap      { flex-wrap: wrap; }
.shrink-0       { flex-shrink: 0; }
.items-center   { align-items: center; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grid-cols-2    { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3    { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.col-span-2     { grid-column: span 2 / span 2; }

/* --- gap --- */
.gap-0\.5   { gap: 0.125rem; }
.gap-1      { gap: 0.25rem; }
.gap-1\.5   { gap: 0.375rem; }
.gap-2      { gap: 0.5rem; }
.gap-4      { gap: 1rem; }
.gap-\[1px\]{ gap: 1px; }
.gap-x-3    { column-gap: 0.75rem; }
.gap-y-0\.5 { row-gap: 0.125rem; }

/* --- space-y (vertical rhythm between siblings) --- */
.space-y-0\.5 > * + * { margin-top: 0.125rem; }
.space-y-1   > * + * { margin-top: 0.25rem; }
.space-y-1\.5 > * + * { margin-top: 0.375rem; }
.space-y-2   > * + * { margin-top: 0.5rem; }
.space-y-3   > * + * { margin-top: 0.75rem; }

/* --- sizing --- */
.w-1\.5   { width: 0.375rem; }
.w-2      { width: 0.5rem; }
.w-2\.5   { width: 0.625rem; }
.w-6      { width: 1.5rem; }
.w-24     { width: 6rem; }
.w-full   { width: 100%; }
.h-1\.5   { height: 0.375rem; }
.h-2      { height: 0.5rem; }
.h-2\.5   { height: 0.625rem; }
.h-6      { height: 1.5rem; }
.h-full   { height: 100%; }
.min-h-screen { min-height: 100vh; }
.max-w-md   { max-width: 28rem; }
.max-w-6xl  { max-width: 72rem; }

/* --- margin --- */
.mx-auto  { margin-left: auto; margin-right: auto; }
.ml-2     { margin-left: 0.5rem; }
.mb-1     { margin-bottom: 0.25rem; }
.mb-1\.5  { margin-bottom: 0.375rem; }
.mb-2     { margin-bottom: 0.5rem; }
.mb-3     { margin-bottom: 0.75rem; }
.mb-5     { margin-bottom: 1.25rem; }
.mb-6     { margin-bottom: 1.5rem; }
.mt-0\.5  { margin-top: 0.125rem; }
.mt-1     { margin-top: 0.25rem; }
.mt-2     { margin-top: 0.5rem; }

/* --- padding --- */
.p-1      { padding: 0.25rem; }
.p-1\.5   { padding: 0.375rem; }
.p-2      { padding: 0.5rem; }
.p-2\.5   { padding: 0.625rem; }
.p-3      { padding: 0.75rem; }
.p-4      { padding: 1rem; }
.p-6      { padding: 1.5rem; }
.px-0\.5  { padding-left: 0.125rem; padding-right: 0.125rem; }
.px-1     { padding-left: 0.25rem; padding-right: 0.25rem; }
.px-1\.5  { padding-left: 0.375rem; padding-right: 0.375rem; }
.px-2     { padding-left: 0.5rem; padding-right: 0.5rem; }
.px-2\.5  { padding-left: 0.625rem; padding-right: 0.625rem; }
.px-3     { padding-left: 0.75rem; padding-right: 0.75rem; }
.py-0\.5  { padding-top: 0.125rem; padding-bottom: 0.125rem; }
.py-1     { padding-top: 0.25rem; padding-bottom: 0.25rem; }
.py-1\.5  { padding-top: 0.375rem; padding-bottom: 0.375rem; }
.py-2     { padding-top: 0.5rem; padding-bottom: 0.5rem; }
.py-2\.5  { padding-top: 0.625rem; padding-bottom: 0.625rem; }

/* --- border radius --- */
.rounded-sm   { border-radius: 0.125rem; }
.rounded      { border-radius: 0.25rem; }
.rounded-md   { border-radius: 0.375rem; }
.rounded-lg   { border-radius: 0.5rem; }
.rounded-xl   { border-radius: 0.75rem; }
.rounded-full { border-radius: 9999px; }

/* --- typography --- */
.text-\[7px\]  { font-size: 7px;  line-height: 1.1; }
.text-\[8px\]  { font-size: 8px;  line-height: 1.15; }
.text-\[9px\]  { font-size: 9px;  line-height: 1.2; }
.text-\[10px\] { font-size: 10px; line-height: 1.3; }
.text-xs   { font-size: 0.75rem;  line-height: 1rem; }
.text-sm   { font-size: 0.875rem; line-height: 1.25rem; }
.text-lg   { font-size: 1.125rem; line-height: 1.75rem; }
.text-xl   { font-size: 1.25rem;  line-height: 1.75rem; }
.text-2xl  { font-size: 1.5rem;   line-height: 2rem; }

.font-semibold { font-weight: 600; }
.font-bold     { font-weight: 700; }
.font-mono     { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                              Consolas, "Liberation Mono", "Courier New", monospace; }
.italic        { font-style: italic; }
.uppercase     { text-transform: uppercase; }
.underline     { text-decoration-line: underline; }
.text-left     { text-align: left; }
.tracking-tight{ letter-spacing: -0.025em; }
.tracking-wide { letter-spacing: 0.025em; }
.leading-tight { line-height: 1.25; }
.leading-snug  { line-height: 1.375; }

/* --- colors --- */
.text-white      { color: #ffffff; }
.text-white\/60  { color: rgba(255,255,255,0.6); }
.text-gray-100   { color: #f3f4f6; }
.text-gray-200   { color: #e5e7eb; }
.text-gray-300   { color: #d1d5db; }
.text-gray-400   { color: #9ca3af; }
.text-gray-500   { color: #6b7280; }
.text-gray-600   { color: #4b5563; }
.text-red-400    { color: #f87171; }

/* --- misc --- */
.overflow-y-auto     { overflow-y: auto; }
.cursor-pointer      { cursor: pointer; }
.select-none         { user-select: none; }
.pointer-events-none { pointer-events: none; }
.transition {
  transition-property: color, background-color, border-color, text-decoration-color,
                       fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

/* --- disabled: variants --- */
.disabled\:opacity-30:disabled        { opacity: 0.3; }
.disabled\:cursor-not-allowed:disabled { cursor: not-allowed; }

/* --- app chrome: keep the board comfortable on small screens --- */
html, body { background-color: #0e1014; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #14161a; }
::-webkit-scrollbar-thumb { background: #33384a; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #454b60; }

/* ===========================================================
   Responsive layout
   Desktop: board column (2fr) + sidebar (1fr).
   Narrow screens: single column, and the fixed-size board is
   scaled down to fit rather than overflowing the viewport.
   =========================================================== */
.board-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1rem;
  align-items: start;
}
.board-col { min-width: 0; }
.side-col  { min-width: 0; }

/* On desktop the sidebar scrolls independently so the page itself stays put and the
   board never gets pushed out of view when panels grow. */
@media (min-width: 1101px) {
  .board-grid { align-items: start; }
  /* Both columns scroll inside themselves, so the page as a whole never scrolls and
     the board cannot be pushed out of view when a panel grows after an action. */
  .board-col, .side-col {
    position: sticky;
    top: 8px;
    max-height: calc(100vh - 16px);
    overflow-y: auto;
    padding-right: 4px;
  }
  /* Keep the board itself pinned at the top of its column: the action panels below it
     grow and shrink between phases, and the board should never be pushed off-screen. */
  .board-col > .board-shell {
    position: sticky;
    top: 0;
    z-index: 5;
    background-color: #0e1014;
  }
}

/* the board is a fixed 746px square; let it shrink on small screens */
.board-shell { max-width: 100%; }

@media (max-width: 1100px) {
  .board-grid { grid-template-columns: 1fr; }
  .board-col, .side-col { grid-column: 1 / -1; }
}

@media (max-width: 820px) {
  /* scale the whole board down proportionally so nothing sits underneath it */
  .board-shell > div:first-child {
    transform: scale(calc((100vw - 3.2rem) / 746));
    transform-origin: top left;
  }
  .board-shell {
    height: calc((100vw - 3.2rem) + 3.2rem);
    overflow: hidden;
  }
}

@media (max-width: 520px) {
  .max-w-6xl { padding-left: 0.25rem; padding-right: 0.25rem; }
  .p-4 { padding: 0.5rem; }
}

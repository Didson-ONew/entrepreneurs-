arter. You may also decline.":"No in\xEDcio da Produ\xE7\xE3o, voc\xEA pode subir em um passo um setor que voc\xEA N\xC3O opera; seu Varejo ent\xE3o alcan\xE7a um distrito a mais neste trimestre. Voc\xEA tamb\xE9m pode recusar.","Average EP per player per game, across every recorded match.":"M\xE9dia de EP por jogador por partida, em todas as partidas registradas.","Average winning score":"Pontua\xE7\xE3o vencedora m\xE9dia","Back to results":"Voltar aos resultados","Back to sign in":"Voltar ao login","Back to the lobby. Your seat is kept - the game is under Your games when you want it.":"Voltar ao lobby. Seu assento fica guardado - a partida est\xE1 em Suas partidas quando voc\xEA quiser.","Board Meeting":"Reuni\xE3o do Conselho","Board Meeting (both meeples)":"Reuni\xE3o do Conselho (os dois trabalhadores)","Board Meeting seats two players, but the second seat is under the IPO tile until the first Megacorp is formed.":"A Reuni\xE3o do Conselho comporta dois jogadores, mas o segundo assento fica sob a ficha de IPO at\xE9 que a primeira Megacorpora\xE7\xE3o seja formada.","Board Meeting takes both your workers. Merge the exact set of company levels a tile asks for and it becomes a Megacorp: big points now, a dividend every quarter, and a bill from the neighbours.":"A Reuni\xE3o do Conselho leva os seus dois trabalhadores. Fa\xE7a a fus\xE3o na combina\xE7\xE3o exata de n\xEDveis de empresa que uma ficha pede e ela vira uma Megacorpora\xE7\xE3o: muitos pontos agora, um dividendo a cada trimestre e uma conta cobrada pelos vizinhos.","Build a company and you push your own industry's price DOWN \u2014 more supply. Every supplier you now pay gets pushed UP \u2014 more demand. Each of those is a whole dollar.":"Construa uma empresa e voc\xEA empurra o pre\xE7o do seu pr\xF3prio setor para BAIXO \u2014 mais oferta. Todo fornecedor que voc\xEA passa a pagar \xE9 empurrado para CIMA \u2014 mais demanda. Cada um desses vale um d\xF3lar inteiro.","Build, produce, sell, score \u2014 3 fiscal years, solo vs bots.":"Construa, produza, venda, pontue \u2014 3 anos fiscais, solo contra bots.","But they all act before you, and may take what you wanted":"Mas todos agem antes de voc\xEA, e podem levar o que voc\xEA queria","Buy it as it stands":"Retomar como est\xE1","Buying that plot":"Comprar esse lote","By the winner":"Pelo vencedor","CLOSING \u2014 a Logistic Hub is placed; years end with scoring":"ENCERRAMENTO \u2014 um Centro Log\xEDstico \xE9 colocado; os anos terminam com pontua\xE7\xE3o",Cancel:"Cancelar","Cash on hand":"Dinheiro em caixa","Choose a new password":"Escolha uma nova senha","Choose a question\u2026":"Escolha uma pergunta\u2026","City Center":"Centro da Cidade","Click a plot to inspect it.":"Clique em um lote para inspecion\xE1-lo.","Click to build here":"Clique para construir aqui","Click two adjacent plots on the board to place the hub between them.":"Clique em dois lotes adjacentes no tabuleiro para colocar o centro entre eles.","Close the rulebook":"Fechar o manual","Coloured squares in a district are its demand: what it will buy":"Os quadrados coloridos de um distrito s\xE3o sua demanda: o que ele vai comprar",Commercial:"Comercial","Company levels":"N\xEDveis de empresa","Concession Holder":"Concession\xE1rio","Confirm placement":"Confirmar posicionamento","Confirm reach":"Confirmar alcance",Continue:"Continuar","Could not reach the server.":"N\xE3o foi poss\xEDvel conectar ao servidor.","Could not read those.":"N\xE3o foi poss\xEDvel ler esses dados.","Create account":"Criar conta","Create an account":"Criar conta","Create room":"Criar sala","DISCS USED":"DISCOS USADOS","Deal each player a random specialist power, one per industry.":"Distribua a cada jogador um poder de especialista aleat\xF3rio, um por setor.","Deck empty":"Baralho vazio","Delivery runs in this order, and demand is first come first served":"A entrega segue esta ordem, e a demanda \xE9 por ordem de chegada","Distressed - unowned":"Em dificuldade - sem dono","Distressed companies (renovate via M&A \u2192 Buy):":"Empresas em dificuldade (reformar via M&A \u2192 Comprar):","Distressed \xB7 unowned (renovate via M&A \u2192 Buy)":"Em dificuldade \xB7 sem dono (reforme via M&A \u2192 Comprar)","Districts you have a presence in - the outright leader at every year end scores The Omnipresent":"Distritos em que voc\xEA tem presen\xE7a - o l\xEDder isolado em cada fim de ano pontua O Onipresente","Do it anyway":"Fazer mesmo assim","Don't raise anything":"N\xE3o captar nada",Done:"Pronto","Draft your starting Blueprints":"Drafte seus Projetos iniciais","Each industry deck runs level 1 down to level 3, instead of being shuffled whole. The early game holds no surprises and no level 3 can be drafted.":"Cada baralho de setor vai do n\xEDvel 1 at\xE9 o n\xEDvel 3, em vez de ser embaralhado por inteiro. O in\xEDcio de partida n\xE3o guarda surpresas e nenhum n\xEDvel 3 pode ser draftado.","Each of the 12 quarters runs the same five phases. Planning and Action are where you act; the rest ask you only when there is a choice to make - where to deliver, what to sell short, where the hub goes.":"Cada um dos 12 trimestres roda as mesmas cinco fases. Planejamento e A\xE7\xE3o s\xE3o onde voc\xEA age; as outras s\xF3 perguntam quando h\xE1 uma escolha a fazer - onde entregar, o que deixar de atender, onde fica o centro log\xEDstico.","Each player is dealt a random specialist power, one per industry.":"Cada jogador recebe um poder de especialista aleat\xF3rio, um por setor.","Each pot is split evenly among that industry's companies":"Cada fundo \xE9 dividido igualmente entre as empresas daquele setor","Empty plot":"Lote vazio","Enter the room code.":"Digite o c\xF3digo da sala.","Enter your name first.":"Digite seu nome primeiro.","Entering industries":"Entrada em setores","Every RIVAL company touching the HQ takes 1 EP a quarter off you \u2014 your own beside it cost nothing, so pick a quiet corner, and build beside theirs":"Cada empresa RIVAL encostando na sede tira 1 EP por trimestre de voc\xEA \u2014 as suas ao lado n\xE3o custam nada, ent\xE3o escolha um canto tranquilo e construa ao lado das deles","Every company pays OPEX each quarter to companies in other industries \u2014 its suppliers, printed on its Blueprint. Those payments are the heart of the game.":"Toda empresa paga OPEX a cada trimestre a empresas de outros setores \u2014 seus fornecedores, impressos no Projeto dela. Esses pagamentos s\xE3o o cora\xE7\xE3o do jogo.","Every icon it fills takes twice its column in units - 2, 4, 6, 8.":"Todo \xEDcone que ela preenche recebe o dobro da sua coluna em unidades - 2, 4, 6, 8.","Every industry buys from 3 others \u2014 and sells to 3 others":"Cada setor compra de 3 outros \u2014 e vende para 3 outros","Every player is a founder. You buy land, build companies on it, and sell what they produce to the districts around them. Most Entrepreneurial Points at the end of Year 3 wins.":"Todo jogador \xE9 um fundador. Voc\xEA compra terrenos, constr\xF3i empresas neles e vende o que elas produzem para os distritos ao redor. Quem tiver mais Pontos de Empreendedorismo no fim do Ano 3 vence.","Every rival company touching":"Cada empresa rival encostando","Every table you are sitting at. Open any of them from any device while you are signed in.":"Todas as mesas em que voc\xEA est\xE1 sentado. Abra qualquer uma delas de qualquer dispositivo enquanto estiver conectado.","Everyone currently on the site, and the games under way":"Quem est\xE1 no site agora e as partidas em andamento","Everything the server remembers between games \u2014 the hall of fame, the registered names, and the notes people have written in \u2014 in one file.":"Tudo o que o servidor guarda entre as partidas \u2014 o hall da fama, os nomes cadastrados e os coment\xE1rios que as pessoas escreveram \u2014 em um \xFAnico arquivo.","Everything you own lives here: cash, running costs, your twelve discs, your hand and your companies.":"Tudo o que \xE9 seu fica aqui: dinheiro, custos correntes, seus doze discos, sua m\xE3o e suas empresas.","Expect them to lean into those industries \u2014 and the prices to move accordingly.":"Espere que eles apostem nesses setores \u2014 e que os pre\xE7os se movam de acordo.",Feedback:"Feedback","Final quarter called":"\xDAltimo trimestre anunciado","Fit the whole board":"Ajustar o tabuleiro inteiro","Forgot password":"Esqueci a senha","Forgot your password":"Esqueceu sua senha","GO PUBLIC / REPOSITION":"ABRIR CAPITAL / REPOSICIONAR","GOING PUBLIC":"ABRINDO CAPITAL","GROUND RENT":"ALUGUEL DO TERRENO","Game Over":"Fim de Jogo","Games recorded":"Partidas registradas","Go Public":"Abrir Capital","Going public: Megacorps":"Abrir capital: Megacorpora\xE7\xF5es","Ground rent":"Aluguel do terreno","Ground rent is $2 per level on a plot, paid to whoever owns that plot":"O aluguel do terreno \xE9 $2 por n\xEDvel em um lote, pago a quem for dono daquele lote","Grow your footprint. BUY takes an unowned plot, or takes over a distressed company \u2014 as it stands for what the bank paid, or renovated with a card from your hand for half that card's setup. LAUNCH builds a Blueprint from your hand onto plots you own \u2014 and pays you 3 EP the first time you enter each industry.":"Amplie sua presen\xE7a. COMPRAR pega um lote sem dono, ou assume uma empresa em dificuldade \u2014 como ela est\xE1, por quanto o banco pagou, ou reformada com uma carta da sua m\xE3o por metade do custo inicial dessa carta. FUNDAR constr\xF3i um Projeto da sua m\xE3o em lotes que voc\xEA possui \u2014 e paga 3 EP na primeira vez que voc\xEA entra em cada setor.","HORIZONTAL \u2014 UT, MA, TE: a level 2 card covers 2 connected plots, a level 3 covers 3":"HORIZONTAL \u2014 UT, MA, TE: uma carta de n\xEDvel 2 cobre 2 lotes conectados, uma de n\xEDvel 3 cobre 3","HOW TO PLAY":"COMO JOGAR","Hall of fame":"Hall da fama","Hall of fame and match statistics (Esc closes)":"Hall da Fama e estat\xEDsticas das partidas ( a no fim da partida) \xB7","Loan discs - 5 EP each at game end":"Discos de empr\xE9stimo - 5 EP cada no fim da partida","Logistic Hub":"Centro Log\xEDstico","Logistic Hubs link districts \u2014 but Utilities and Retail can never use them":"Centros Log\xEDsticos ligam distritos \u2014 mas Servi\xE7os P\xFAblicos e Varejo nunca podem us\xE1-los","M&A":"M&A",Manufacturing:"Manufatura","May route up to [level] units into other industries' rows in its home district.":"Pode direcionar at\xE9 [level] unidades para linhas de outros setores em seu distrito de origem.","Meant to join a friend instead? Go back and use their room code.":"Queria entrar com um amigo? Volte e use o c\xF3digo da sala dele.","Megacorps (tiles, brand, tithe)":"Megacorpora\xE7\xF5es (fichas, marca, d\xEDzimo)","Message the table":"Mensagem para a mesa","New here? Read How to play first":"Novo por aqui? Leia Como jogar primeiro","New password (8 characters or more)":"Nova senha (8 caracteres ou mais)","No finished games with a human at the table yet. Play one and this fills in.":"Nenhuma partida conclu\xEDda com um humano \xE0 mesa ainda. Jogue uma e isto se preenche.","No games finished yet.":"Nenhuma partida conclu\xEDda ainda.","No games in the book match that. Widen the filter, or clear it.":"Nenhuma partida do livro corresponde a isso. Amplie o filtro ou limpe-o.","No messages yet. Say hello to the table.":"Nenhuma mensagem ainda. D\xEA um oi para a mesa.","No microphone available":"Nenhum microfone dispon\xEDvel","No more eligible adjacent plots \u2014 this cluster can't be completed here. Cancel and try elsewhere, or buy more land first.":"N\xE3o h\xE1 mais lotes adjacentes eleg\xEDveis \u2014 este agrupamento n\xE3o pode ser completado aqui. Cancele e tente em outro lugar, ou compre mais terreno antes.","No points scored yet.":"Nenhum ponto marcado ainda.","No points scored.":"Nenhum ponto marcado.","No relay is set up on this server, so a direct path has to exist between the two of you. Mobile networks usually block one. On wifi it should connect; otherwise use chat, or ask the host to configure a TURN relay.":"N\xE3o h\xE1 retransmissor configurado neste servidor, ent\xE3o precisa existir um caminho direto entre voc\xEAs dois. Redes m\xF3veis costumam bloquear isso. No wifi deve conectar; se n\xE3o, use o chat, ou pe\xE7a ao anfitri\xE3o para configurar um retransmissor TURN.","Nobody is playing right now.":"Ningu\xE9m est\xE1 jogando agora.","Nobody, apparently.":"Ningu\xE9m, aparentemente.","None owned.":"Nenhum.","None yet.":"Nenhum ainda.","Not now \u2014 play as a guest":"Agora n\xE3o \u2014 jogar como convidado","Not you? Just type over it.":"N\xE3o \xE9 voc\xEA? \xC9 s\xF3 digitar por cima.","Noted, thank you.":"Anotado, obrigado.","Nothing distressed in the bank right now.":"Nada em dificuldade no banco agora.","Nothing drafted yet.":"Nada draftado ainda.","Nothing eligible to upgrade.":"Nada eleg\xEDvel para expandir.","Nothing here yet.":"Nada aqui ainda.","Nothing matches that.":"Nada corresponde a isso.","Nothing recorded yet.":"Nada registrado ainda.","ON THE CALL":"NA CHAMADA","ON THE SITE NOW":"NO SITE AGORA","One company stays standing as the HQ and banks its industry's price \xF7 the tile's tier in EP every quarter":"Uma empresa fica de p\xE9 como sede e embolsa o pre\xE7o do setor dela \xF7 o patamar da ficha em EP a cada trimestre","Only games played with the persona module on.":"S\xF3 partidas jogadas com o m\xF3dulo de personas ligado.","Only you can play under this name.":"S\xF3 voc\xEA pode jogar com este nome.","Ordered decks":"Baralhos ordenados",Other:"Outro","Others at the table":"Outros na mesa","Owned plots (value = printed road price, +$1 per occupied plot touching it, +$1 if adjacent to an LH):":"Lotes pr\xF3prios (valor = pre\xE7o impresso da via, +$1 por lote ocupado encostando nele, +$1 se adjacente a um LH):","Owned plots:":"Lotes possu\xEDdos:","PLANNING \u2014 place your workers":"PLANEJAMENTO \u2014 coloque seus trabalhadores","PRODUCTION \u2014 supplier bills and ground rent are paid automatically":"PRODU\xC7\xC3O \u2014 as contas de fornecedores e o aluguel do terreno s\xE3o pagos automaticamente","Pass this action":"Passar esta a\xE7\xE3o","Password (8 characters or more)":"Senha (8 caracteres ou mais)","Pick a BP, then click its plot(s) on the board \u2014 owned, unoccupied plots only. Horizontal industries at level 2+ need a connected cluster.":"Escolha um Projeto, depois clique no(s) lote(s) dele no tabuleiro \u2014 apenas lotes com dono e desocupados. Setores horizontais no n\xEDvel 2+ precisam de um grupo conectado.","Pick a question. If you forget your password, answering it is how you set a new one. Choose something you will still know in a month.":"Escolha uma pergunta. Se voc\xEA esquecer sua senha, respond\xEA-la \xE9 como voc\xEA define uma nova. Escolha algo que voc\xEA ainda vai saber daqui a um m\xEAs.","Placing early earns +1 extra action per player who joins after you":"Colocar cedo rende +1 a\xE7\xE3o extra por jogador que entrar depois de voc\xEA","Placing last means acting first, with only one action":"Colocar por \xFAltimo \xE9 agir primeiro, com apenas uma a\xE7\xE3o","Placing workers: last in, first out":"Coloca\xE7\xE3o de trabalhadores: \xFAltimo a entrar, primeiro a sair","Planning & Action Tracks":"Trilhas de Planejamento & A\xE7\xE3o","Play Again":"Jogar de novo","Play online with friends \u2014 2 to 6 players.":"Jogue online com amigos \u2014 2 a 6 jogadores.","Players are matched on the name they type, so two people sharing a name share a row. Bots are never listed, and a seat handed to a bot part-way through earns its player nothing for that game.":"Os jogadores s\xE3o identificados pelo nome que digitam, ent\xE3o duas pessoas com o mesmo nome dividem uma linha. Bots nunca aparecem na lista, e um assento entregue a um bot no meio da partida n\xE3o rende nada ao jogador naquela partida.",Playtest:"Testes","Playtest feedback":"Feedback dos testes","Plots owned - the outright leader at every year end scores The Real-Estate Mogul":"Lotes possu\xEDdos - o l\xEDder isolado a cada fim de ano pontua O Magnata Imobili\xE1rio","Pot, then the top Blueprint. Hover an industry for what it does.":"Fundo, depois o Projeto do topo. Passe o mouse sobre um setor para ver o que ele faz.","Prices move as the city is built":"Os pre\xE7os se movem conforme a cidade \xE9 constru\xEDda","Printed road price, +$1 per occupied plot touching it (corners count inside a district), +$1 beside a Logistic Hub. What it costs to buy, and what it sells for.":"Pre\xE7o de via impresso, +$1 por lote ocupado que o toque (cantos contam dentro de um distrito), +$1 ao lado de um Centro Log\xEDstico. O que custa comprar, e por quanto vende.","Public Health Director":"Diretor de Sa\xFAde P\xFAblica","Put a copy back":"Restaurar c\xF3pia","Putting a copy back never deletes anything.":"Restaurar uma c\xF3pia nunca apaga nada.","R&D":"P&D","REVENUE \u2014 deliver production to demand icons for cash":"RECEITA \u2014 entregue produ\xE7\xE3o aos \xEDcones de demanda por dinheiro","ROOM CODE":"C\xD3DIGO DA SALA","Raise Capital":"Captar Recursos","Reaches 1 extra district per level, of its choice. Never uses hubs.":"Alcan\xE7a 1 distrito extra por n\xEDvel, \xE0 sua escolha. Nunca usa centros.","Reaches a level\xD7level block of districts around it. Never uses hubs.":"Alcan\xE7a um bloco de distritos de n\xEDvel\xD7n\xEDvel ao redor. Nunca usa centros.","Reaches every district on the hub network, not just its own.":"Alcan\xE7a todos os distritos da rede log\xEDstica, n\xE3o s\xF3 o seu.","Read the rules (Esc closes)":"Leia as regras (Esc fecha)","Reading the record book\u2026":"Lendo o livro de registros\u2026","Reading this strip is the main skill in the game":"Ler essa faixa \xE9 a principal habilidade do jogo","Reading\u2026":"Lendo\u2026","Recent games":"Partidas recentes","Reconnecting\u2026":"Reconectando\u2026",Records:"Registros","Recycle remainder & move on":"Reciclar o resto & seguir","Refreshes itself every few seconds. A seat shows as a bot once the server has taken it over.":"Atualiza sozinho a cada poucos segundos. Um assento aparece como bot assim que o servidor assume o controle dele.","Reload the page":"Recarregar a p\xE1gina","Remove this bot":"Remover este bot","Remove this player":"Remover este jogador","Reposition (become 1st)":"Reposicionar (virar 1\xBA)","Research (choose a deck)":"Pesquisar (escolha um baralho)","Reserve it above and nobody else can use it.":"Reserve acima e mais ningu\xE9m poder\xE1 us\xE1-lo.","Reset by email":"Redefinir por e-mail","Reset selection":"Limpar sele\xE7\xE3o",Residential:"Residencial","Resort Developer":"Incorporador de Resorts",Retail:"Varejo","Review the final board, log and stats":"Rever o tabuleiro final, o hist\xF3rico e as estat\xEDsticas","Reviewing the final board \u2014 the game is over, nothing can be changed.":"Revendo o tabuleiro final \u2014 a partida acabou, nada pode ser mudado.","Room code":"C\xF3digo da sala",Rulebook:"Manual","Run out and you cannot buy, build or borrow":"Se acabarem, voc\xEA n\xE3o pode comprar, construir nem tomar emprestado","SUPPLIERS / QTR":"FORNECEDORES / TRI","Score at the year end":"Pontuar no fim de ano","Score steadily rather than chasing one big move. Breadth pays early, size pays late.":"Pontue de forma constante em vez de perseguir uma grande jogada. Amplitude paga cedo, tamanho paga tarde.","Score the session and say why.":"D\xEA uma nota \xE0 sess\xE3o e diga por qu\xEA.","Search the rules\u2026":"Buscar nas regras\u2026","Sell for cash":"Vender por dinheiro","Sell to neighbours & move on":"Vender aos vizinhos & seguir","Selling what you produce":"Vender o que voc\xEA produz","Sells one unit to each business or hub within [level] plots of it, at full price, once the icons are full.":"Vende uma unidade a cada neg\xF3cio ou centro dentro de [level] lotes de dist\xE2ncia, a pre\xE7o cheio, depois que os \xEDcones e ia de Suprimentos \u2014 voc\xEA pode subir um setor que voc\xEA n\xE3o opera","Systems Architect":"Arquiteto de Sistemas","Table rules":"Regras da mesa","Take Loan (+$20, +1 disc)":"Pegar empr\xE9stimo (+$20, +1 disco)","Taken so far \u2014 and what it does to prices":"Levados at\xE9 agora \u2014 e o que isso faz com os pre\xE7os","Talk to the other players while you play. Your browser will ask for microphone permission. Audio goes directly between players, not through the server.":"Converse com os outros jogadores enquanto joga. Seu navegador vai pedir permiss\xE3o para o microfone. O \xE1udio vai direto entre os jogadores, n\xE3o pelo servidor.",Technology:"Tecnologia","Tell me how it played":"Conte como foi a partida","Tell the designer how it played (Esc closes)":"Conte ao designer como foi a partida (Esc fecha)","That did not go through.":"N\xE3o foi enviado.","That file is not a backup - it is not even JSON.":"Esse arquivo n\xE3o \xE9 um backup - n\xE3o \xE9 nem JSON.","That is $1 over the price. If you sell at the premium, the Utilities price falls one step at the end of the quarter, for everyone.":"Isso \xE9 $1 acima do pre\xE7o. Se voc\xEA vender com esse \xE1gio, o pre\xE7o de Servi\xE7os P\xFAblicos cai um passo no fim do trimestre, para todos.","That plot\u2019s neighbours all already have a hub \u2014 reset and pick a different starting plot.":"Os vizinhos d\u2019aquele lote j\xE1 t\xEAm todos um centro \u2014 limpe a sele\xE7\xE3o e escolha outro lote inicial.","That reset link has expired or has already been used.":"Esse link de redefini\xE7\xE3o expirou ou j\xE1 foi usado.","The Bank":"O Banco","The Real-Estate Mogul and The Omnipresent are paid once, after Quarter 12, instead of at every year end.":"O Magnata Imobili\xE1rio e O Onipresente s\xE3o pagos uma \xFAnica vez, depois do Trimestre 12, em vez de a cada fim de ano.","The board is 16 districts, each with 4 plots":"O tabuleiro tem 16 distritos, de 4 lotes cada","The file holds password hashes  servidor n\xE3o aceitou esse arquivo.","The tile pays 8\u201322 EP at once; the other merged companies go distressed and it locks one of your company slots":"A ficha paga 8\u201322 EP de uma vez; as outras empresas fundidas ficam em dificuldade e ela trava um dos seus espa\xE7os de empresa","These records live on the game server, so they are only here when you are playing online.":"Estes registros ficam no servidor do jogo, ent\xE3o s\xF3 aparecem aqui quando voc\xEA est\xE1 jogando online.","This browser will not give the page a microphone. Chat still works.":"Este navegador n\xE3o d\xE1 microfone \xE0 p\xE1gina. O chat continua funcionando.","This reserves your name, so nobody else can play as you and change your record.":"Isso reserva seu nome, para que mais ningu\xE9m possa jogar como voc\xEA e alterar seu registro.","Time played":"Tempo de jogo","Total EP":"Total de EP","Total EP scored across every recorded game. Matches and wins sit beside it on purpose: a big total built out of forty games is a different thing from the same total built out of five.":"Total de EP marcados em todas as partidas registradas. Partidas e vit\xF3rias ficam ao lado de prop\xF3sito: um total alto constru\xEDdo em quarenta partidas \xE9 coisa diferente do mesmo total constru\xEDdo em cinco.","Turn assets into cash. LOAN takes $20 from the bank for one of your discs (buy it back later or lose 5 EP). SELL turns a plot, an unbuilt Blueprint, or a whole company into money at market value.":"Transforme bens em dinheiro. EMPR\xC9STIMO tira $20 do banco em troca de um dos seus discos (recompre depois ou perca 5 EP). VENDER transforma um lote, um Projeto n\xE3o constru\xEDdo ou uma empresa inteira em dinheiro pelo valor de mercado.","Turn the turn chime off":"Desligar o aviso de turno","Twelve discs total \u2014 one per plot, one per company, one per loan":"Doze discos ao todo \u2014 um por lote, um por empresa, um por empr\xE9stimo","Two or more people":"Duas ou mais pessoas","Type your nam

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#0e1014"/><title>Entrepreneurs &mdash; Online</title><style>/* ===========================================================
   Entrepreneurs — standalone stylesheet
   Implements exactly the Tailwind utility classes used by the
   game, so the app runs fully offline with no CDN dependency.
   =========================================================== */

/* --- preflight (the parts Tailwind's CDN normally supplies) --- */
*, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; line-height: 1.5; }
body {
  line-height: inherit;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  background-color: #0e1014;
  color: #e5e7eb;
}
button { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit;
         color: inherit; background-color: transparent; background-image: none; cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3, h4 { font-size: inherit; font-weight: inherit; }
:root { --gap: 0px; }

/* --- display --- */
.block          { display: block; }
.inline-block   { display: inline-block; }
.flex           { display: flex; }
.inline-flex    { display: inline-flex; }
.grid           { display: grid; }

/* --- position --- */
.fixed          { position: fixed; }
.z-50           { z-index: 50; }

/* --- flex / grid --- */
.flex-1         { flex: 1 1 0%; }
.flex-col       { flex-direction: column; }
.flex-wrap      { flex-wrap: wrap; }
.shrink-0       { flex-shrink: 0; }
.items-center   { align-items: center; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grid-cols-2    { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3    { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.col-span-2     { grid-column: span 2 / span 2; }

/* --- gap --- */
.gap-0\.5   { gap: 0.125rem; }
.gap-1      { gap: 0.25rem; }
.gap-1\.5   { gap: 0.375rem; }
.gap-2      { gap: 0.5rem; }
.gap-4      { gap: 1rem; }
.gap-\[1px\]{ gap: 1px; }
.gap-x-3    { column-gap: 0.75rem; }
.gap-y-0\.5 { row-gap: 0.125rem; }

/* --- space-y (vertical rhythm between siblings) --- */
.space-y-0\.5 > * + * { margin-top: 0.125rem; }
.space-y-1   > * + * { margin-top: 0.25rem; }
.space-y-1\.5 > * + * { margin-top: 0.375rem; }
.space-y-2   > * + * { margin-top: 0.5rem; }
.space-y-3   > * + * { margin-top: 0.75rem; }

/* --- sizing --- */
.w-1\.5   { width: 0.375rem; }
.w-2      { width: 0.5rem; }
.w-2\.5   { width: 0.625rem; }
.w-6      { width: 1.5rem; }
.w-24     { width: 6rem; }
.w-full   { width: 100%; }
.h-1\.5   { height: 0.375rem; }
.h-2      { height: 0.5rem; }
.h-2\.5   { height: 0.625rem; }
.h-6      { height: 1.5rem; }
.h-full   { height: 100%; }
.min-h-screen { min-height: 100vh; }
.max-w-md   { max-width: 28rem; }
.max-w-6xl  { max-width: 72rem; }

/* --- margin --- */
.mx-auto  { margin-left: auto; margin-right: auto; }
.ml-2     { margin-left: 0.5rem; }
.mb-1     { margin-bottom: 0.25rem; }
.mb-1\.5  { margin-bottom: 0.375rem; }
.mb-2     { margin-bottom: 0.5rem; }
.mb-3     { margin-bottom: 0.75rem; }
.mb-5     { margin-bottom: 1.25rem; }
.mb-6     { margin-bottom: 1.5rem; }
.mt-0\.5  { margin-top: 0.125rem; }
.mt-1     { margin-top: 0.25rem; }
.mt-2     { margin-top: 0.5rem; }

/* --- padding --- */
.p-1      { padding: 0.25rem; }
.p-1\.5   { padding: 0.375rem; }
.p-2      { padding: 0.5rem; }
.p-2\.5   { padding: 0.625rem; }
.p-3      { padding: 0.75rem; }
.p-4      { padding: 1rem; }
.p-6      { padding: 1.5rem; }
.px-0\.5  { padding-left: 0.125rem; padding-right: 0.125rem; }
.px-1     { padding-left: 0.25rem; padding-right: 0.25rem; }
.px-1\.5  { padding-left: 0.375rem; padding-right: 0.375rem; }
.px-2     { padding-left: 0.5rem; padding-right: 0.5rem; }
.px-2\.5  { padding-left: 0.625rem; padding-right: 0.625rem; }
.px-3     { padding-left: 0.75rem; padding-right: 0.75rem; }
.py-0\.5  { padding-top: 0.125rem; padding-bottom: 0.125rem; }
.py-1     { padding-top: 0.25rem; padding-bottom: 0.25rem; }
.py-1\.5  { padding-top: 0.375rem; padding-bottom: 0.375rem; }
.py-2     { padding-top: 0.5rem; padding-bottom: 0.5rem; }
.py-2\.5  { padding-top: 0.625rem; padding-bottom: 0.625rem; }

/* --- border radius --- */
.rounded-sm   { border-radius: 0.125rem; }
.rounded      { border-radius: 0.25rem; }
.rounded-md   { border-radius: 0.375rem; }
.rounded-lg   { border-radius: 0.5rem; }
.rounded-xl   { border-radius: 0.75rem; }
.rounded-full { border-radius: 9999px; }

/* --- typography --- */
.text-\[7px\]  { font-size: 7px;  line-height: 1.1; }
.text-\[8px\]  { font-size: 8px;  line-height: 1.15; }
.text-\[9px\]  { font-size: 9px;  line-height: 1.2; }
.text-\[10px\] { font-size: 10px; line-height: 1.3; }
.text-xs   { font-size: 0.75rem;  line-height: 1rem; }
.text-sm   { font-size: 0.875rem; line-height: 1.25rem; }
.text-lg   { font-size: 1.125rem; line-height: 1.75rem; }
.text-xl   { font-size: 1.25rem;  line-height: 1.75rem; }
.text-2xl  { font-size: 1.5rem;   line-height: 2rem; }

.font-semibold { font-weight: 600; }
.font-bold     { font-weight: 700; }
.font-mono     { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                              Consolas, "Liberation Mono", "Courier New", monospace; }
.italic        { font-style: italic; }
.uppercase     { text-transform: uppercase; }
.underline     { text-decoration-line: underline; }
.text-left     { text-align: left; }
.tracking-tight{ letter-spacing: -0.025em; }
.tracking-wide { letter-spacing: 0.025em; }
.leading-tight { line-height: 1.25; }
.leading-snug  { line-height: 1.375; }

/* --- colors --- */
.text-white      { color: #ffffff; }
.text-white\/60  { color: rgba(255,255,255,0.6); }
.text-gray-100   { color: #f3f4f6; }
.text-gray-200   { color: #e5e7eb; }
.text-gray-300   { color: #d1d5db; }
.text-gray-400   { color: #9ca3af; }
.text-gray-500   { color: #6b7280; }
.text-gray-600   { color: #4b5563; }
.text-red-400    { color: #f87171; }

/* --- misc --- */
.overflow-y-auto     { overflow-y: auto; }
.cursor-pointer      { cursor: pointer; }
.select-none         { user-select: none; }
.pointer-events-none { pointer-events: none; }
.transition {
  transition-property: color, background-color, border-color, text-decoration-color,
                       fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

/* --- disabled: variants --- */
.disabled\:opacity-30:disabled        { opacity: 0.3; }
.disabled\:cursor-not-allowed:disabled { cursor: not-allowed; }

/* --- app chrome: keep the board comfortable on small screens --- */
html, body { background-color: #0e1014; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #14161a; }
::-webkit-scrollbar-thumb { background: #33384a; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #454b60; }

/* ===========================================================
   Responsive layout
   Desktop: board column (2fr) + sidebar (1fr).
   Narrow screens: single column, and the fixed-size board is
   scaled down to fit rather than overflowing the viewport.
   =========================================================== */
.board-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1rem;
  align-items: start;
}
.board-col { min-width: 0; }
.side-col  { min-width: 0; }

/* On desktop the sidebar scrolls independently so the page itself stays put and the
   board never gets pushed out of view when panels grow. */
@media (min-width: 1101px) {
  /* The whole app was capped at 72rem, which left no room for more than one column of
     panels beside the 746px board. Let it use the real width of a desktop monitor. */
  .max-w-6xl { max-width: min(1880px, 99vw) !important; }
  .board-grid {
    align-items: start;
    /* The board keeps its natural width; everything else shares the rest. */
    grid-template-columns: auto minmax(0, 1fr);
  }
  .board-col, .side-col {
    position: sticky;
    top: 8px;
    max-height: calc(100vh - 16px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .side-col { z-index: 5; }
  .board-pane > .board-shell {
    position: sticky;
    top: 0;
    z-index: 5;
    background-color: #0e1014;
  }
  .play-rail > * + * { margin-top: 0.6rem; }
  /* A single tall stack of panels meant constant scrolling. Flow them into as many
     columns as the screen allows instead, so standings, bank, pots, decks, megacorps
     and the log are all on screen at once. */
  .side-col {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
    gap: 0.6rem;
    align-content: start;
  }
  .side-col > * + * { margin-top: 0 !important; }   /* space-y-3 does not apply in a grid */
}

/* ===========================================================
   Readability: the interface was built at 8-10px, which is hard
   work on a large monitor. Nudge every small size up a step.
   =========================================================== */
.text-\[8px\]  { font-size: 9.5px; }
.text-\[9px\]  { font-size: 10.5px; }
.text-\[10px\] { font-size: 11.5px; }
.text-\[11px\] { font-size: 12.5px; }
.text-xs        { font-size: 13px; line-height: 1.15rem; }
.text-sm        { font-size: 14.5px; line-height: 1.3rem; }

/* the board is a fixed 746px square; let it shrink on small screens */
.board-shell { max-width: 100%; }

@media (max-width: 1100px) {
  .board-grid { grid-template-columns: 1fr; }
  .board-col, .side-col { grid-column: 1 / -1; }
}

@media (max-width: 820px) {
  /* scale the whole board down proportionally so nothing sits underneath it */
  .board-shell > div:first-child {
    transform: scale(calc((100vw - 3.2rem) / 746));
    transform-origin: top left;
  }
  .board-shell {
    height: calc((100vw - 3.2rem) + 3.2rem);
    overflow: hidden;
  }
}

@media (max-width: 520px) {
  .max-w-6xl { padding-left: 0.25rem; padding-right: 0.25rem; }
  .p-4 { padding: 0.5rem; }
}


/* ===========================================================
   Wide desktops: the tracks, the action panel and your own
   ledger sit in a rail to the LEFT of the board instead of
   below it, so the things you click are never off-screen.
   =========================================================== */
@media (min-width: 1500px) {
  .board-col {
    display: grid;
    grid-template-columns: 360px auto;
    gap: 0.7rem;
    align-items: start;
    overflow: visible;
    max-height: none;
    position: static;
  }
  .play-rail {
    order: -1;                       /* rail first, board second */
    position: sticky;
    top: 8px;
    max-height: calc(100vh - 16px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .board-pane {
    position: sticky;
    top: 8px;
    z-index: 20;          /* hover panels from the right-hand districts must sit
                             above the side column, which is also sticky */
  }
}


/* Game Over: every player's breakdown is shown at once, side by side. */
.gameover-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 0.6rem;
  align-items: start;
}

,blocks:[{p:"You are a founder building a city's economy. You buy land, build companies on it, and sell what they produce to the districts around them. The player with the most Entrepreneurial Points (EP) at the end of Year 3 wins."},{ul:["2 to 4 players.","3 years of 4 quarters - 12 rounds in total.","The board is 16 districts of 4 plots each.","The coloured squares inside a district are its demand: what it will buy."]},{h:"The one idea underneath everything"},{p:"Every company pays OPEX each quarter, and that money does not vanish - it goes to the industries printed on its Blueprint as suppliers. So the industry nobody is building is quietly collecting everyone else's money, and its price is climbing while the crowded industries sink toward $1. Reading that pressure is the game."},{note:"The economy is a closed loop on purpose. There is no faucet other than the bank loan and the $1 recycling floor, so a table that all builds the same thing genuinely impoverishes itself. Every playtest that felt flat was a table that had not noticed this yet."}]},{id:"setup",title:"Setup",blocks:[{p:"The board is built fresh every game: the four central districts are one each of Financial Centre, Industrial Area, Civic Centre and Landmark, shuffled between the four middle cells, and twelve of the sixteen suburb districts are drawn at random for the ring around them. No two games have the same map."},{h:"Seats, capital and starting hand"},{p:"Seating is randomised - you are not automatically first. Your starting money and number of Blueprints follow the seat you drew, not the player you are: later seats get less money but more cards."},{table:{head:["Players","Seat 1","Seat 2","Seat 3","Seat 4"],rows:[["4","$25 / 1 card","$25 / 2 cards","$20 / 2 cards","$20 / 3 cards"],["3","$25 / 1 card","$25 / 2 cards","$20 / 3 cards","-"],["2","$20 / 2 cards","$20 / 2 cards","-","-"]]}},{h:"The draft"},{p:"Each industry deck is shuffled whole, so any level can be sitting on top - a level 3 may be there from the very first pick. The top card of every deck is public all game."},{p:"Starting Blueprints are drafted in reverse seat order - the LAST seat picks first. On your pick you take the face-up top card of any industry deck. Watch what the others are taking: every card drafted is a company that will probably get built, which pushes that industry's price down and its suppliers' prices up before you have even started."},{note:"Shuffling the decks whole is what puts a big company within reach early, for a player willing to take the loan or sell hard to afford it. It also means the draft cannot be planned in advance: what is on top is luck, and what you do about it is not."},{h:"The rest"},{ul:["Ten discs each. Nothing else marks what you own.","Megacorp tiles: sixteen exist, and only (number of players + 1) are shuffled into the game.","Personas are dealt to everyone by default - one each, drawn from six. Leave them out for a first game if you like."]},{note:"Reverse-order drafting is the only catch-up mechanism in the game, and it is deliberately small. Seat 4 in a four-player game opens with $20 and three cards against seat 1's $25 and one card - enough to matter in the first two quarters, not enough to decide a game."}]},{id:"discs",title:"Your ten discs",blocks:[{p:"Your discs are your entire footprint in the world. You have ten, and every one of them is committed somewhere:"},{ul:["one disc on each plot of land you own,","one disc on each active company you run,","one disc in the bank for each loan you have not repaid."]},{p:"If you have no free disc you cannot buy land, launch a company, take over a distressed structure, or take a loan - no matter how much cash you are holding. You free a disc by selling a plot, selling a company, or repaying a loan."},{p:"Separately, you have five company slots. Every active company fills one, and so does every Megacorp headquarters you have formed - a headquarters no longer trades, but it still stands on the board and still holds its disc."},{note:"The disc limit is the real brake on the game, not money. Cash arrives in floods once your pots start paying, and without a hard cap on presence the leader would simply buy the map. Ten discs also makes selling land a genuine decision rather than a pure loss."}]},{id:"quarter",title:"A quarter, step by step",blocks:[{p:"All twelve quarters run the same five phases. You only make decisions in the first two - the rest resolves around you."},{table:{head:["Phase","What happens"],rows:[["1. Planning","Everyone places their workers on the action tracks."],["2. Action","The tracks resolve and each worker takes its actions."],["3. Production","Every active company pays OPEX; rent and supplier pots are paid out of it."],["4. Revenue","You deliver production to demand icons for cash, then the industry pots are shared out."],["5. Closing","A new Logistic Hub opens. At the end of each year, the two land awards are paid."]]}}]},{id:"planning",title:"Planning: placing workers",blocks:[{p:"You have two workers (three each in a two-player game). Players place one worker at a time in turn order, going round until everyone has placed all of theirs."},{h:"The four tracks"},{table:{head:["Track","Slots","What it does"],rows:[["Raise Capital","4","Turn assets into cash - LOAN or SELL."],["M&A","4","Grow your footprint - LAUNCH or BUY."],["R&D","4","Improve what you have - RESEARCH or UPGRADE."],["Board Meeting","2","GO PUBLIC or REPOSITION. Takes all your workers."]]}},{p:"The second Board Meeting seat is sealed under the IPO tile until somebody claims it by going public."},{h:"Last in, first out - the rule that catches everyone"},{p:"Workers fill a track from left to right, but the track resolves from RIGHT TO LEFT. Whoever placed LAST on a track acts FIRST on it."},{p:"Committing early is paid for in actions: your worker takes one action, plus one extra for every worker that lands after it in the same track. A worker alone in a track that then fills up completely takes four actions - but the other three players will all have acted before it, and may have taken exactly what it was waiting for."},{p:"The tracks themselves resolve in a fixed order: Raise Capital, then M&A, then R&D, then Board Meeting."},{h:"Board Meeting"},{p:"Going to the Board Meeting costs ALL of your workers for the quarter and buys a single action. It is a real sacrifice, and it is meant to be."},{note:"First-in-last-out worker placement is the spine of the game. It is the only mechanism that makes the turn order matter continuously rather than once per round, and it is why Reposition is worth two workers to a player sitting fourth."}]},{id:"actions",title:"The actions",blocks:[{h:"Raise Capital"},{ul:["LOAN - take $20 from the bank and pledge one disc. You may buy the disc back at a year end; if you never do, it costs you 5 EP at the end of the game.","SELL - a Blueprint from your hand ($4 / $8 / $12 by level), a company (half its setup cost, or the full cost if it has been upgraded - the building goes to the bank as a Distressed Asset), or a plot of land at its current value."]},{h:"M&A"},{ul:["LAUNCH - build a Blueprint from your hand onto empty plots, paying its setup cost. The first time you ever build in an industry you bank 5 EP immediately.","BUY - take any unowned plot at its current value, or take over a Distressed Asset. You may buy a distressed structure as it stands for half its own setup cost, keeping its Blueprint and level, or renovate it with a card from your hand for half that card's setup cost. Any distressed structure is fair game, including one you sold yourself - buying it back as it stands needs no card at all."]},{p:"You may build on plots owned by another player. They collect the rent every quarter, but the company is yours."},{p:"A renovation has to fit the shell that is already standing. The card must match the distressed structure's level, and from level 2 upwards its scaling type as well: a level-2 or level-3 horizontal structure spreads across several plots and cannot be rebuilt as a vertical one, nor the other way round. At level 1 both kinds occupy a single plot, so a level-1 shell is open to any level-1 Blueprint."},{h:"R&D"},{ul:["RESEARCH - draw the face-up top card of any industry deck. Hand limit is five cards.","UPGRADE - pay a company's setup cost again. Its production and its OPEX both double and its level goes up by one."]},{p:"A horizontal company (Utilities, Manufacturing, Technology) grows sideways: upgrading needs an adjacent plot that you own and that is empty. A vertical company (Retail, Hospitality, Healthcare) stacks on the plot it already occupies. Each company may be upgraded once."},{p:"Adjacent means sharing an edge - up, down, left or right - whether the two plots are in the same district or across the border into the next one. Plots that meet only at a corner are not adjacent, so a company can never stand on both. The same rule decides where a multi-plot company may be built in the first place: its plots must form one connected shape."},{h:"Board Meeting"},{ul:["GO PUBLIC - merge companies to claim a Megacorp tile. You may only take this action if you actually hold the exact combination one of the available tiles asks for.","REPOSITION - move to first in turn order, and place both of your workers together at the start of next quarter's planning."]},{p:"The IPO tile is not an action you can take. It is the prize for being first: whoever forms the first Megacorp of the game also takes it, worth 5 EP, and that is what opens the second Board Meeting seat for the rest of the game. Until then only one player can sit here each quarter, and a player who cannot form a Megacorp has only Reposition available."}]},{id:"land",title:"Land and buildings",blocks:[{h:"What a plot costs"},{p:"A plot's value is its printed road price plus $1 for every occupied plot next to it, plus $1 if it touches a Logistic Hub. Road prices run from 1 at the outer edge to 6 in the dead centre of the city. You pay that to buy, and you receive it when you sell - so land near the action genuinely appreciates as the city fills in."},{h:"Footprints"},{p:"A vertical company always occupies exactly one plot, whatever its level. A horizontal company occupies one plot per level, and those plots must form a connected cluster of owned, empty land - it need not be your own, though its owner will collect the rent. A level-3 horizontal Blueprint therefore needs three connected empty plots before you can build it at all."},{p:"A plot can carry more than one level, and rent follows the levels rather than the plots: $3 for every level standing on a plot, paid to that plot's owner. Where a persona lets a company grow the other way - Technology stacking instead of spreading, Hospitality spreading instead of stacking - you choose which plot of the footprint the new level goes on. Stack it on land you own and the rent for those levels comes back to you."},{h:"Selling the ground out from under a building"},{p:"A company can only produce while you own every plot it stands on. Selling one of those plots does not destroy the building, but it stops producing until the land is bought back."},{note:"That rule exists so a desperate player has one more thing to sell without immediately losing the company, and so an opponent's distressed land is worth watching. It is deliberately not a way to attack someone else's building - you can only sell your own."}]},{id:"prices",title:"Prices, supply and demand",blocks:[{p:"Every industry has one market price that everybody sells at. It starts at its base price and moves as the city is built."},{table:{head:["Industry","Base price","Scaling"],rows:[["Utilities (UT)","$2","Horizontal"],["Retail (RE)","$2","Vertical"],["Hospitality (HO)","$3","Vertical"],["Manufacturing (MA)","$3","Horizontal"],["Healthcare (HC)","$4","Vertical"],["Technology (TE)","$4","Horizontal"]]}},{h:"How the price moves"},{p:"Launching a company puts one supply mark on its own industry, and one demand mark on every supplier industry printed on its Blueprint."},{p:"Two steps in either direction move the price by $1, and no price ever falls below $1."},{p:"A crowded industry can sink to $1, barely above the $1 you get for recycling unsold goods. A neglected one that half the table depends on can climb past $8 a unit."},{h:"What each company costs and produces"},{p:"Setup / OPEX / Production, by level."},{table:{head:["Industry","Level 1","Level 2","Level 3"],rows:[["Utilities (UT)","15 / 4 / 4","20 / 7 / 8","30 / 10 / 16"],["Retail (RE)","10 / 5 / 4","15 / 9 / 8","25 / 14 / 16"],["Hospitality (HO)","10 / 6 / 3","15 / 10 / 6","25 / 16 / 12"],["Manufacturing (MA)","20 / 4 / 3","35 / 7 / 6","60 / 10 / 12"],["Healthcare (HC)","20 / 5 / 2","35 / 9 / 4","60 / 14 / 8"],["Technology (TE)","15 / 6 / 2","25 / 10 / 4","40 / 16 / 8"]]}},{h:"Who pays whom"},{p:"Every company pays OPEX to companies in other industries - its suppliers, printed on its Blueprint. The chain closes a loop, so no industry is ever a dead end. Level 1 cards have one supplier, level 2 have two, and level 3 have all three."},{table:{head:["Industry","Supplier 1","Supplier 2","Supplier 3"],rows:[["Utilities","HO","TE","HC"],["Retail","TE","HO","MA"],["Hospitality","MA","HC","RE"],["Manufacturing","HC","RE","UT"],["Healthcare","RE","UT","TE"],["Technology","UT","MA","HO"]]}},{p:"The three are not equally common: across the ten Blueprints of an industry, the first supplier appears most often and the third least. Read the Blueprint in front of you rather than the table."},{note:"The asymmetry between demand (+1 per company, immediately) and supply (-1 per two companies) is what stops a runaway. It means being the second builder in an industry is much better than being the fifth, but it also means feeding a crowded industry pays more every time somebody joins it."}]},{id:"production",title:"Production: paying the bills",blocks:[{p:"Every active company pays its OPEX, automatically, whether or not it sells anything afterwards. That money is immediately split:"},{ul:["Rent - $3 for every level standing on a plot - goes to whoever owns that plot. A vertical company stacks all its levels on one plot, so its whole rent goes to one landlord; a horizontal one puts a level on each plot it covers, so each landlord collects $3. On your own land it comes straight back to you.","Everything left over flows into the industry pots of that company's suppliers, divided in proportion to the dependency values on the Blueprint."]},{h:"If you cannot pay"},{p:"Before OPEX is charged, any player whose cash will not cover their whole bill gets a window to choose what to sell. This is a forced sale and everything in it goes at HALF what a planned sale through Raise Capital would fetch: Blueprints $2 / $4 / $6 by level, plots half their value, a company half what it would have paid voluntarily. What you keep control of is which assets go, not the price."},{p:"If the bill still cannot be met once a company's OPEX comes due, that company enters SOLVENCY: the bank sells for you, at those same half rates, and the company that triggered it goes to the bank as a Distressed Asset."},{note:"Selling at full price under duress made the shortfall window strictly better than planning ahead - you could ignore your OPEX, wait to be forced, and lose nothing. Halving it is what makes the Raise Capital track worth a worker."},{note:"Forced liquidation pays exactly half of a voluntary sale across the board. Being caught short is meant to hurt enough that players keep a buffer, without being a death spiral - a solvency event usually costs a player a quarter, not the game."}]},{id:"revenue",title:"Revenue: selling what you produce",blocks:[{p:"Each company produces a number of units printed on its Blueprint, doubled if it has been upgraded. You deliver those units to demand icons your company can reach, and each icon pays the current market price for your industry."},{p:"Delivery goes in turn order. Every icon is first come, first served, so being early in the order is worth real money on a contested district - and it is the main thing REPOSITION buys you."},{h:"Which icons you may use"},{p:"Every district shows a 4x4 grid of demand. Each row is an industry; the four columns are levels 1 to 4. You may deliver to an icon if the row's industry is yours and the column is no higher than your company's level - so a bigger company reaches deeper into the same district."},{ul:["Rows 3 and 4 of every district stay closed until Quarter 5.","At the end of Quarter 8 the entire demand grid is wiped clean and every icon reopens for Year 3.","Each icon can be sold to once, by whoever gets there first.","Anything you cannot sell is recycled for $1 a unit."]},{h:"How far a company reaches"},{p:"A company can always sell into the district or districts its own plots sit in. Beyond that:"},{ul:["Logistic Hubs stand on plots. If any plot of your footprint is orthogonally beside a hub - up to four plots can be, since corners do not count - your company joins the network and reaches every district that any hub on the board stands in.","Utilities and Retail can never use hubs at all.","Healthcare is on the hub network natively - it reaches every hub district without needing to touch one."]},{h:"Industry abilities"},{table:{head:["Industry","Ability"],rows:[["Utilities","Reads demand across a block of districts as wide as its level, positioned anywhere that still covers its own footprint. Never uses hubs."],["Retail","Sells into one extra district of your choice per level. Never uses hubs."],["Hospitality","Sells one extra unit at market price for every business or hub within its level in plots - no demand icon needed."],["Manufacturing","May cross-sell up to its level in units into OTHER industries' rows in its own district."],["Healthcare","Reaches every district on the hub network without touching a hub."],["Technology","Delivers two units to every icon it reaches instead of one."]]}},{h:"B2B: the pots pay out"},{p:"Megacorp headquarters take their cut first: each siphons $5 from the pot of every industry it touches."},{p:"Each remaining pot is then split evenly among the active companies of that industry - one equal share each, whatever size those companies are. It is the industry being paid, not the building."},{p:"Whatever will not divide cleanly stays in the pot and rides forward. A pot of $10 shared between three Healthcare companies pays $3 to each and carries $1 into next quarter."},{p:"A pot with no company of that type to pay carries over in full, growing quarter by quarter. An industry nobody serves is often the most profitable thing on the board."},{note:"Technology's doubler and Hospitality's neighbour bonus are the two abilities that scale with the board rather than with the card, and they are the reason those two industries look weak on paper and play strong. Utilities was originally 'distance less than level from any home district', which quietly let a level-3 utility see the entire city; it now reads an honest N x N block."}]},{id:"closing",title:"Closing and the year end",blocks:[{p:"Every quarter ends with a new Logistic Hub being built on an empty plot. The first player in turn order chooses which one. That plot is filled for good - nothing can be built there afterwards - and the hub adds its own district to the network."},{h:"At the end of Quarter 4, 8 and 12"},{ul:["The Real-Estate Mogul and The Omnipresent are awarded - 10 EP each, 5 EP for second place.","You may buy back loan discs: $30 at the end of Year 1, $35 at Year 2, $40 at Year 3."]},{p:"Companies do not wait for the year end. A company scores the moment it is finished - see below - so by the time a year ends its EP are already on its card. What a year end decides is who is holding the city."},{h:"Companies score on completion"},{p:"The moment a company is built it takes 3 EP per level, placed on its card. The moment it is upgraded, the EP already on the card vest into your bank and the company scores afresh at its new level, immediately. It is one score per build and one per upgrade - the same way entering an industry pays you the moment you build there, not at some later reckoning."},{p:"So a level-2 company built and then upgraded pays 6 EP on the day it opens and 9 more on the day it grows."},{p:"EP sitting on a company's card are yours - they show in the standings immediately. They vest - move permanently into your bank - when the company is upgraded, sold, merged into a Megacorp, or at the end of the game. You never lose EP you have already scored."},{note:"Three EP a level, paid on completion, is the change that made building feel like the point of the game rather than a way to fund the land awards. At 1 EP a level, paid a quarter or two later, a company had to survive to be worth anything and still lost to cash; now the act of building is the reward, and the risk of a late solvency event no longer eats it."},{note:"Scoring on the card rather than straight into the bank is what makes upgrading a company feel like harvesting it, and it is why the standings can be read honestly at any point without a separate 'if the game ended now' calculation."}]},{id:"megacorp",title:"Going public and Megacorps",blocks:[{p:"Going public always means merging companies to claim a Megacorp tile, from the very first time it is done. Each tile names an exact combination of company levels and pays between 8 and 22 EP, and you must hold precisely that combination of active companies."},{p:"Whoever forms the first Megacorp of the game also takes the IPO tile: 5 EP, and the second Board Meeting seat opens for the rest of the game."},{h:"What a merger does"},{ul:["You choose one of the merged companies to become the Megacorp HQ. It keeps its building and returns its Blueprint to its industry deck.","All the others go to the bank as Distressed Assets - anyone may take them over later.","The HQ stops trading: with no Blueprint it produces nothing, pays no OPEX and draws no share of any pot.","It keeps its disc, and it permanently locks one of your five company slots. Every Megacorp you form narrows how wide you can operate.","Every B2B, the HQ siphons $5 from the pot of every industry it touches, before the pots are shared out."]},{p:"Only (number of players + 1) tiles are in play, so the good combinations are contested."},{h:"The tiles"},{table:{head:["Megacorp","Requires","Companies","Value"],rows:[["Local Syndicate","3 x L1","3","8 EP"],["Founders\u2019 Pact","2 x L1 + 1 x L2","3","9 EP"],["Continental Holdings","4 x L1","4","10 EP"],["Twin Ventures","1 x L1 + 2 x L2","3","10 EP"],["Silent Merger","3 x L2","3","11 EP"],["Neighborhood Holdings","3 x L1 + 1 x L2","4","12 EP"],["Regional Consolidated","2 x L2 + 1 x L3","3","13 EP"],["Crosstown Alliance","2 x L1 + 2 x L2","4","13 EP"],["Metro Trust","1 x L2 + 2 x L3","3","14 EP"],["Crossroads Deal","1 x L1 + 3 x L2","4","14 EP"],["Skyline Consolidated","3 x L3","3","15 EP"],["Apex Group","2 x L2 + 2 x L3","4","16 EP"],["Titan Industries","2 x L3 + 1 x L4","3","17 EP"],["Colossus Group","4 x L3","4","19 EP"],["Empire Holdings","1 x L2 + 2 x L3 + 1 x L4","4","20 EP"],["Omnicorp","3 x L3 + 1 x L4","4","22 EP"]]}},{p:"A level-4 company is one that has been upgraded from level 3, so the richest tiles need companies you have already paid to grow."},{note:"A merger is meant to be a real decision, not a free bonus: you are trading away the companies' production, their remaining upgrades, and any level EP they had not scored yet, for a lump sum now and a parasite on your neighbours. EP already on their cards vest, so those are safe. It is strongest in Year 3 and usually a mistake in Year 1."}]},{id:"scoring",title:"Winning",blocks:[{p:"Score steadily rather than chasing one big move. Breadth pays early, size pays late."},{table:{head:["Source","EP"],rows:[["Entering an industry for the first time","+5 each, once per industry per game, banked immediately"],["Each company, when it is built - and again when it is upgraded","+3 per level"],["Megacorp tile","+8 to +22 as printed"],["IPO tile (first player to go public)","+5"],["The Real-Estate Mogul - most plots owned, at every year end","+10, second place +5"],["The Omnipresent - most districts you are present in, at every year end","+10, second place +5"],["Cash on hand at the end","+1 per full $10"],["Each loan disc still in the bank","-5"]]}},{p:"For The Omnipresent, a district counts if you own a plot in it or one of your active companies stands in it. Tied players split the combined value of the places they cover."},{p:"Most EP after Quarter 12 wins. If the final scores tie, the player with more money wins; if they are still tied, the player with fewer loan discs left in the bank."},{note:"The 5 EP entry bonus used to be the strongest steering mechanism in the game, worth five year-end levels. At 3 EP a level it is worth less than a level-2 company, which is the intended correction: breadth still pays, but it no longer beats depth on its own. Both are now paid on construction, so neither can be lost to a late solvency event."}]},{id:"personas",title:"Personas",blocks:[{p:"Personas are asymmetric powers, one tied to each industry. They are dealt by default - leave them out for a first game if you like - and only as many as there are players are dealt, so at least two always sit out. Everyone's persona is public from the start, so you can weigh your own specialism and everybody else's while drafting."},{table:{head:["Persona","Power"],rows:[["Systems Architect (TE)","Your Technology companies upgrade vertically, stacking on one plot instead of needing a free neighbour."],["Public Health Director (HC)","Your Healthcare companies ignore the level restriction: a level-1 clinic may serve any column of a Healthcare row."],["White-Label Supplier (MA)","When your Manufacturing cross-sells into another industry's row, it is paid that industry's price instead of its own."],["Resort Developer (HO)","Your Hospitality companies upgrade horizontally, spreading across plots so more businesses and hubs sit next to them."],["Supply Chain Expert (RE)","At the start of Revenue, raise one industry you do NOT operate by one step; your Retail then reaches one extra district this quarter."],["Concession Holder (UT)","Your Utilities production sells for $1 above the current price."]]}},{note:"Each persona is a tilt, not a cage. They all deliberately point at doing more of one industry, and the 5 EP breadth bonus deliberately points the other way, so a persona changes your best line without collapsing it to one."}]},{id:"variants",title:"Rule variants (optional)",blocks:[{p:"Every one of these is off by default, and a table that leaves them alone plays exactly the rules in this book. They can be combined freely."},{p:"They all read as playing it the older way, because that is what they are. Five rules that were optional in v12 became standard in v13, and what remains switchable is the game as it was before."},{table:{head:["Variant","What changes"],rows:[["Score at the year end","A company waits for the next year end to take its EP, instead of scoring the moment it is built or upgraded. It still scores once per build or upgrade."],["Levels score single","A company level is worth 1 EP instead of 3. The weight of the game moves back toward land, cash and the industry entry bonuses."],["Ordered decks","Each industry deck runs level 1 on top down to level 3 at the bottom, instead of being shuffled whole. No level 3 can be drafted, and the early game holds no surprises."],["Hubs on the road","A Logistic Hub straddles a border and joins the two districts either side, instead of standing on a plot and reaching only its own. No plot is consumed, and every hub is worth two districts rather than one."],["Land awards at the end only","The Real-Estate Mogul and The Omnipresent are paid once, after Quarter 12, instead of at every year end. Land becomes a late-game race rather than something to hold all game."]]}},{p:"Agree which of them are on before the draft. Several change what a Blueprint is worth, so choosing halfway through is not a neutral act.",only:"table"},{p:"Whichever are on is shown in the waiting room before the game starts, and recorded with the finished game, so a variant table is never mistaken for a standard one in the records.",only:"digital"},{note:"These are kept switchable so the two versions can be played side by side, not because the older ones are balanced against the new. Turning all five on plays v12 almost exactly."},{note:"Hubs on plots is a genuine constriction: a quarter of the plots on the board have no orthogonal neighbour at all, so a badly placed hub connects nobody. That is the rule working as intended - it is why the hub picker tells you how many plots a spot would connect before you commit to it - but it is also the rule most likely to need another look after a few tables."}]},{id:"online",title:"Playing online",only:"digital",blocks:[{p:"Create a room and share the six-character code. Anyone who enters it joins your table."},{ul:["2 to 4 human seats. Bots fill any seat you do not want to wait for.","If the table is full or the game has already started, latecomers join as watchers: they see the whole board and can chat and talk, but cannot act.","Text chat and voice chat are built in. Voice runs peer to peer - the server only introduces you.","Refreshing or losing your connection does not lose your seat. Come back to the same address and you are put straight back in.","If someone leaves for good, the host can hand their seat to a bot so the table is not held up."]},{p:"The server is authoritative: it runs the same rules engine and rejects anything that is not your move, so nobody can act out of turn."}]},{id:"quickref",title:"Quick reference",blocks:[{table:{head:["",""],rows:[["Game length","12 quarters (3 years of 4)"],["Workers","2 each, or 3 each in a two-player game"],["Discs","10, covering plots owned + active companies + unpaid loans"],["Company slots","5, counting Megacorp headquarters"],["Hand limit","5 Blueprints"],["Loan","+$20 and one disc; buy back for $30 / $35 / $40 at year ends; -5 EP if unpaid"],["Sell a Blueprint","$4 / $8 / $12 by level; $2 / $4 / $6 in a forced sale"],["Sell a company","half its setup, or the full setup if upgraded; halved again in a forced sale"],["Plot value","road price (1-6) + $1 per occupied neighbour + $1 if it touches a hub"],["Upgrade","pay the setup cost again; production and OPEX double; level +1"],["Rent","$3 per company level, to the owners of the plots it stands on"],["Unsold production","$1 per unit"],["Industry pot","split evenly among that industry's active companies; the remainder rides forward"],["Renovation","card must match the shell's level; from level 2 up, its scaling type too"],["Final tie","most money, then fewest loan discs in the bank"],["Demand rows 3-4","closed until Quarter 5"],["Demand grid","wiped clean at the end of Quarter 8"],["Company scoring","3 EP per level, the moment it is built - and again when it is upgraded"],["Industry debut","5 EP the first time you build in each industry, banked at once"],["Land awards","10 EP / 5 EP for most plots and most districts, at every year end"],["Logistic Hub","one per quarter, on an empty plot; reaches its own district; joins orthogonally"]]}}]}];var Ha=Re(Hn()),Jy=Re(Il()),O=Re(Lt()),J={bg:"#14161a",edge:"#262a33",panel:"#0f1115",text:"#c3c9d4",dim:"#8b93a3",head:"#ffffff",accent:"#f5d76e",accentBg:"#231f14"},Vs=["#f5d76e","#c9ccd4","#c98f5b"];function xb({children:e}){return typeof document>"u"?null:(0,Jy.createPortal)(e,document.body)}var Wy=e=>{if(!e)return"\u2014";let t=new Date(e);return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`},Iy=e=>{if(!e)return"";let t=Math.max(0,Math.floor((Date.now()-e)/1e3));if(t<90)return"just now";let n=Math.floor(t/60);if(n<60)return`$
